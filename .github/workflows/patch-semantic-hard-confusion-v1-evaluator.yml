name: Patch semantic hard-confusion v1 evaluator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-semantic-hard-confusion-v1-evaluator.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply execution-only corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/evaluate_semantic_display_hard_confusion_v1.py')
          s=p.read_text(encoding='utf-8')
          old='"ad_id": str(row["ad_id"]),'
          new='"ad_id": f"hc-{pair_id}-{cid}-{row[\"ad_id\"]}",'
          if old not in s:
              raise SystemExit('ad_id patch target drift')
          s=s.replace(old,new,1)
          old='"decision_gate_passed": false'
          new='"decision_gate_passed": False'
          if old not in s:
              raise SystemExit('False patch target drift')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile scripts/evaluate_semantic_display_hard_confusion_v1.py
      - name: Commit corrections
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/evaluate_semantic_display_hard_confusion_v1.py
          git commit -m 'research: harden semantic hard-confusion v1 evaluator'
          git pull --rebase origin main
          git push
