name: Test semantic oracle contract once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-semantic-oracle-contract-once.yml'

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests/test_semantic_oracle_contract.py
