name: Patch semantic-search scope SSOT once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-semantic-scope-ssot-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Patch research plan
        run: python3 scripts/patch_semantic_scope_ssot_once.py
      - name: Validate diff
        run: |
          git diff --check
          git diff -- docs/research-plan.md
      - name: Commit SSOT patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research-plan.md
          git diff --cached --quiet && exit 1
          git commit -m 'docs: clarify semantic-search scope and fallback ladder'
          git push
