name: A593 language diversity evaluate once

on:
  push:
    paths:
      - research/evaluation/v31/a593-language-diversity-generation-v0.json
      - research/training/v31/a593-language-diversity-training-v0.jsonl
      - research/evaluation/v31/a593-language-diversity-holdout-v0.jsonl

permissions:
  contents: write
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download frozen A593 teacher corpus
        uses: actions/download-artifact@v4
        with:
          name: gemma-a593-checkpoint
          path: artifacts/a593
          github-token: ${{ github.token }}
          run-id: 34232985249
      - name: Compile-check frozen evaluator
        run: >-
          python -m py_compile
          scripts/evaluate_gemma_a149.py
          scripts/evaluate_a593_language_diversity_falsifier.py
      - name: Evaluate fixed A against A plus diversified language
        run: >-
          python scripts/evaluate_a593_language_diversity_falsifier.py
          --teacher artifacts/a593/gemma-a593-teacher.jsonl
          --training research/training/v31/a593-language-diversity-training-v0.jsonl
          --holdout research/evaluation/v31/a593-language-diversity-holdout-v0.jsonl
          --generation-summary research/evaluation/v31/a593-language-diversity-generation-v0.json
          --output artifacts/a593-language-diversity-result-v0.json
      - name: Freeze result and self-remove
        run: |
          cp artifacts/a593-language-diversity-result-v0.json research/evaluation/v31/a593-language-diversity-result-v0.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/a593-language-diversity-evaluate-once.yml
          git add research/evaluation/v31/a593-language-diversity-result-v0.json .github/workflows/a593-language-diversity-evaluate-once.yml
          git commit -m 'research: freeze A593 language-diversity result'
          git fetch origin main
          git rebase origin/main
          git push
