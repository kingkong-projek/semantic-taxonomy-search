name: Sync A149 SSOT once

on:
  push:
    paths:
      - .github/workflows/sync-a149-ssot-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Patch research-plan SSOT
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/research-plan.md")
          text = path.read_text(encoding="utf-8")

          text = text.replace("**Last updated:** 2026-09-07", "**Last updated:** 2026-09-08", 1)

          old_budget = """**Compile-time semantic tournament (ACTIVE next architecture phase; 2026-09-07).** The target universe is small and mostly static, so the next architecture question is not `which neural model can the browser tolerate?` but **how much semantic intelligence can be paid once at build time and compiled into a tiny deterministic runtime artifact**. **Teacher/build marginal-cost budget is 0 SEK. No local teacher inference is available.** The currently allowed teacher pool is therefore limited to **Muse Spark**, **Gemma 4 through the already-available zero-cost hosted access**, and **GPT-5.6 Sol in the existing ChatGPT conversation**. No new paid API spend and no local/open-weight teacher run is authorized. The browser must not inherit teacher parameter count or runtime dependency."""
          new_budget = """**Compile-time semantic tournament (ACTIVE next architecture phase; 2026-09-07).** The target universe is small and mostly static, so the next architecture question is not `which neural model can the browser tolerate?` but **how much semantic intelligence can be paid once at build time and compiled into a tiny deterministic runtime artifact**. **Teacher/build marginal-cost budget is at most 10 SEK total for the current tournament phase, with zero-cost access preferred. No local teacher inference is available.** The currently allowed teacher pool is therefore limited to **Gemma 4 through the already-available zero-cost hosted access as the primary bulk teacher**, **Muse Spark as a zero/very-low-cost fallback or independent challenger if needed**, and **GPT-5.6 Sol in the existing ChatGPT conversation** for bounded prompt design/judging. Do not exceed 10 SEK cumulative marginal API spend without an explicit new project decision. The browser must not inherit teacher parameter count or runtime dependency."""
          if old_budget not in text:
              raise SystemExit("budget paragraph drift")
          text = text.replace(old_budget, new_budget, 1)

          old_teacher = """Teacher diversity is desirable, but the executable pool is deliberately narrow under the **0 SEK / no-local-inference constraint**: Muse Spark and Gemma 4 provide scalable hosted generation where the existing free access permits it; GPT-5.6 Sol in ChatGPT is the high-capability interactive teacher/judge for bounded batches, prompt design, difficult boundary cases and corpus quality review. Do not assume Sol is a reproducible batch API. If a teacher is unavailable within this pool at zero marginal cost, skip it rather than substitute a paid or local model. Teacher disagreement must be retained as evidence rather than silently collapsed into false ground truth. Source-attested taxonomy/AF evidence remains provenance-distinct from generated teacher language. Any external teacher input must be public or synthetic by construction; user logs, personal data and unpublished sensitive material are excluded from this build path."""
          new_teacher = """Teacher diversity is desirable, but the executable pool is deliberately narrow under the **<=10 SEK total / no-local-inference constraint**. Gemma 4 is the primary bulk teacher because the available hosted tier is zero-cost; Muse Spark is reserved for cases where an independent teacher is materially useful and must stay within the same total budget; GPT-5.6 Sol in ChatGPT remains the high-capability interactive teacher/judge for bounded batches, prompt design, difficult boundary cases and corpus quality review. Do not assume Sol is a reproducible batch API. Do not add another paid or local teacher merely for ensemble diversity. Teacher disagreement must be retained as evidence rather than silently collapsed into false ground truth. Source-attested taxonomy/AF evidence remains provenance-distinct from generated teacher language. Any external teacher input must be public or synthetic by construction; user logs, personal data and unpublished sensitive material are excluded from this build path."""
          if old_teacher not in text:
              raise SystemExit("teacher paragraph drift")
          text = text.replace(old_teacher, new_teacher, 1)

          marker = "Tournament entrants, at minimum:\n"
          if marker not in text:
              raise SystemExit("tournament marker drift")
          result = """**Tournament scoreboard update (2026-09-08).** Round 0 falsified three lower-bound formulations without eliminating their broader architecture classes: B0 token->concept sparse E5 geometry was only **117,908 bytes gzip** but scored **0/17 YV and 0/81 KV Hit@5**; C0 PCA32/int8 mean-token student was **712,990 bytes gzip** but scored **0/17 YV and 6/81 KV**; D0 Model2Vec was **16.8 MB gzip** and scored only **3/17 YV and 20/81 KV**, so it fails both the client-size and quality bars. The useful teacher signal is therefore treated as sequence/context-level rather than token geometry. Evidence: `research/evaluation/v31/compile-time-semantic-tournament-round0.json`.\n\n**First A result — `YV-A149-Gemma4-26B-sequence-expansion-v0` (2026-09-08): CONTINUE A.** A bounded zero-cost Gemma 4 26B run generated **1,192 Swedish teacher descriptions for 149/2,105 occupations** (149/150 requests succeeded). Appending those phrases as ordinary BM25 document language, never as exact identity surfaces, improves the already-opened 40 targetable YV stress cases from **18/40 -> 24/40 Hit@5** and **9/40 -> 12/40 Top1**: direct **8/12 -> 10/12**, colloquial **2/12 -> 3/12**, noisy **5/8 -> 7/8**, indirect **3/8 -> 4/8**. Only **20/40** stress target families and **2/17** strict source-attested targets are covered by the partial teacher corpus; accordingly the strict 17-case Hit@5 remains **9/17** while MRR moves **0.418849 -> 0.443722**. The compact partial teacher map is only **18,103 bytes gzip-9**; a linear full-universe projection is about **256 kB gzip**, but that projection is not evidence until the full artifact is generated and measured. Negative/abstention behavior did not improve. A raw single-ranker replacement moves the 333 canonical source-truth suite from **333/333 -> 330/333 Top1** while preserving **333/333 Hit@5**; this reinforces rather than changes the product boundary: **ordinary YV/KV lookup remains the unchanged privileged Track-1 path, while A belongs only to the explicit description-fallback entrypoint**. Do not infer the UI lane from query wording. Next priority is to generate/freeze A for all 2,105 YV identities, measure actual compressed size, and replay the same frozen diagnostics without pruning or tuning on them. Evidence: `research/evaluation/v31/compile-time-semantic-tournament-a149.json`.\n\n"""
          if "**First A result — `YV-A149-Gemma4-26B-sequence-expansion-v0`" not in text:
              text = text.replace(marker, result + marker, 1)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit SSOT and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-a149-ssot-once.yml
          git add docs/research-plan.md
          git diff --cached --check
          git commit -m "docs: sync A149 tournament decision"
          git push
