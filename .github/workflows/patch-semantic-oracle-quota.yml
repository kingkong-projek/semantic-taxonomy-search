name: Patch semantic oracle quota handling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-semantic-oracle-quota.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply pre-outcome quota-only patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/evaluate_p80_display_semantic_oracle.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('import os\nimport time\n', 'import os\nimport re\nimport time\n')
          s=s.replace('MAX_TASK_PHRASES = 8\n', 'MAX_TASK_PHRASES = 2\nEVIDENCE_VERSION = "label-alt3-definition50-task2x24-v0"\n')
          old='''def candidate_evidence(concept: dict[str, Any], phrases: list[str]) -> dict[str, Any]:\n    label = str(concept.get("preferred_label") or "").strip()\n    definition = str(concept.get("definition") or "").strip()\n    if norm(definition) == norm(label):\n        definition = ""\n    return {\n        "canonical_label": label,\n        "alternative_labels": clean_strings(concept.get("alternative_labels"), limit=5),\n        "definition": definition,\n        "task_evidence": clean_strings(phrases, limit=MAX_TASK_PHRASES),\n    }\n'''
          new='''def clip_words(text: Any, limit: int) -> str:\n    return " ".join(str(text or "").split()[:limit])\n\n\ndef candidate_evidence(concept: dict[str, Any], phrases: list[str]) -> dict[str, Any]:\n    label = str(concept.get("preferred_label") or "").strip()\n    definition = str(concept.get("definition") or "").strip()\n    if norm(definition) == norm(label):\n        definition = ""\n    return {\n        "canonical_label": clip_words(label, 12),\n        "alternative_labels": [clip_words(x, 12) for x in clean_strings(concept.get("alternative_labels"), limit=3)],\n        "definition": clip_words(definition, 50),\n        "task_evidence": [clip_words(x, 24) for x in clean_strings(phrases, limit=MAX_TASK_PHRASES)],\n    }\n'''
          if old not in s:
              raise SystemExit('candidate_evidence block drift')
          s=s.replace(old,new)
          anchor='''def semantic_judge_batches(\n'''
          helper='''def call_semantic_with_quota_retry(api_key: str, prompt_text: str) -> tuple[dict[str, Any], dict[str, Any]]:\n    # Execution-only handling for the free-tier input-token window. The first run\n    # produced zero judgments and failed before outcomes, so this does not change\n    # prompt/model/verdict/gates. It only waits for the quota window instead of\n    # exhausting generic short retries.\n    for attempt in range(12):\n        try:\n            return gemma.call_json(api_key, prompt_text, temperature=0.0, max_attempts=1)\n        except RuntimeError as exc:\n            message = str(exc)\n            if "429" not in message and "RESOURCE_EXHAUSTED" not in message:\n                raise\n            match = re.search(r"retry in ([0-9.]+)s", message, re.IGNORECASE)\n            wait = (float(match.group(1)) + 3.0) if match else 35.0\n            wait = max(25.0, min(wait, 90.0))\n            print(f"semantic oracle quota window; wait {wait:.1f}s", flush=True)\n            time.sleep(wait)\n    raise RuntimeError("semantic oracle quota remained exhausted after 12 quota-aware retries")\n\n\n'''
          if anchor not in s:
              raise SystemExit('semantic_judge_batches anchor missing')
          s=s.replace(anchor, helper+anchor, 1)
          old_call='''        raw, meta = gemma.call_json(api_key, prompt(batch, by_id, phrase_map), temperature=0.0)\n        last_call = time.monotonic()\n'''
          new_call='''        raw, meta = call_semantic_with_quota_retry(api_key, prompt(batch, by_id, phrase_map))\n        last_call = time.monotonic()\n'''
          if old_call not in s:
              raise SystemExit('semantic call block drift')
          s=s.replace(old_call,new_call)
          s=s.replace('ap.add_argument("--requests-per-minute", type=float, default=6.0)', 'ap.add_argument("--requests-per-minute", type=float, default=3.0)')
          s=s.replace('"evidence_contract": "canonical label/alternative labels/definition plus at most 8 already-frozen source-bound task phrases; no candidate facts may be invented",', '"evidence_contract": "fixed compact source-bound payload: canonical label, <=3 alternative labels, definition <=50 words, <=2 already-frozen task phrases <=24 words each; no candidate facts may be invented",\n        "evidence_version": EVIDENCE_VERSION,')
          p.write_text(s, encoding='utf-8')

          r=Path('scripts/replay_p80_display_semantic_oracle_opened.py')
          t=r.read_text(encoding='utf-8')
          t=t.replace('requests_per_minute=6.0,', 'requests_per_minute=3.0,')
          r.write_text(t, encoding='utf-8')
          PY
          python -m py_compile scripts/evaluate_p80_display_semantic_oracle.py scripts/replay_p80_display_semantic_oracle_opened.py
      - name: Commit quota-only patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/evaluate_p80_display_semantic_oracle.py scripts/replay_p80_display_semantic_oracle_opened.py
          git commit -m 'research: make semantic oracle quota-safe before outcomes'
          git pull --rebase origin main
          git push
