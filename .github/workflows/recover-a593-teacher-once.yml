name: Recover frozen A593 teacher corpus

on:
  push:
    paths:
      - '.github/workflows/recover-a593-teacher-once.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect historical A593 merge provenance
        run: |
          set -euo pipefail
          echo '=== commits touching workflows and mentioning A593/evaluator ==='
          git log --all --format='%H %s' -G 'evaluate_gemma_a593|A593|a593' -- .github/workflows || true
          echo '=== matching historical workflow blobs ==='
          for c in $(git log --all --format='%H' -G 'evaluate_gemma_a593|A593|a593' -- .github/workflows | head -20); do
            echo "--- $c $(git show -s --format=%s "$c")"
            git ls-tree -r --name-only "$c" .github/workflows | while read -r p; do
              if git show "$c:$p" 2>/dev/null | grep -qiE 'evaluate_gemma_a593|A593|a593'; then
                echo "### $p"
                git show "$c:$p" | sed -n '1,240p'
              fi
            done
          done
      - name: Recover exact frozen corpus from Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: 7769db2124ef190d74964ddb9f97da1d67137dad9b51e9e534e4e9bd6a24f847
        run: |
          set -euo pipefail
          mkdir -p /tmp/a593-artifacts /tmp/a593-unpacked
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | select(.name | contains("gemma4-yv-teacher")) | [.id,.name,.workflow_run.id] | @tsv' \
            > /tmp/a593-artifacts/list.tsv
          test -s /tmp/a593-artifacts/list.tsv
          while IFS=$'\t' read -r id name run_id; do
            zip="/tmp/a593-artifacts/${id}.zip"
            dir="/tmp/a593-unpacked/${id}"
            mkdir -p "$dir"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$zip"
            unzip -q "$zip" -d "$dir"
          done < /tmp/a593-artifacts/list.tsv

          python - <<'PY'
          import hashlib, itertools, json, os
          from pathlib import Path

          expected = os.environ['EXPECTED_SHA']
          files = sorted(p for root in Path('/tmp/a593-unpacked').glob('*') for p in root.rglob('*.jsonl'))
          found = None
          provenance = []
          for p in files:
              b = p.read_bytes()
              if hashlib.sha256(b).hexdigest() == expected:
                  found, provenance = b, [str(p)]
                  break

          # Try raw byte concatenations first.
          if found is None:
              for a, b in itertools.permutations(files, 2):
                  ba, bb = a.read_bytes(), b.read_bytes()
                  for merged in (ba + bb, ba.rstrip(b'\r\n') + b'\n' + bb, ba.rstrip(b'\r\n') + b'\n' + bb.lstrip(b'\r\n')):
                      if hashlib.sha256(merged).hexdigest() == expected:
                          found, provenance = merged, [str(a), str(b)]
                          break
                  if found is not None:
                      break

          # Try deterministic JSONL serializations of every 593-row pair. This is
          # reconstruction only: accept nothing unless the frozen byte hash matches.
          if found is None:
              parsed = {}
              for p in files:
                  try:
                      parsed[p] = [json.loads(line) for line in p.read_text(encoding='utf-8-sig').splitlines() if line.strip()]
                  except Exception:
                      pass
              for a, b in itertools.permutations(parsed, 2):
                  rows = parsed[a] + parsed[b]
                  if len(rows) != 593 or len({str(r.get('concept_id')) for r in rows}) != 593:
                      continue
                  variants = []
                  for sort_keys in (False, True):
                      for compact in (False, True):
                          kwargs = {'ensure_ascii': False, 'sort_keys': sort_keys}
                          if compact:
                              kwargs['separators'] = (',', ':')
                          text = '\n'.join(json.dumps(r, **kwargs) for r in rows) + '\n'
                          variants.append(text.encode('utf-8'))
                  for merged in variants:
                      if hashlib.sha256(merged).hexdigest() == expected:
                          found, provenance = merged, [str(a), str(b)]
                          break
                  if found is not None:
                      break

          if found is None:
              raise SystemExit('Could not reconstruct exact frozen A593 corpus SHA; refusing recovery')

          rows = [json.loads(line) for line in found.decode('utf-8').splitlines() if line.strip()]
          if len(rows) != 593 or len({r['concept_id'] for r in rows}) != 593:
              raise SystemExit('A593 cardinality/identity validation failed')
          if sum(len(r.get('phrases') or []) for r in rows) != 4744:
              raise SystemExit('A593 phrase count validation failed')
          if any(str(r.get('model') or '') != 'gemma-4-26b-a4b-it' for r in rows):
              raise SystemExit('A593 model validation failed')

          out = Path('research/enrichment/v31/gemma4-yv-a593')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'phrases.jsonl').write_bytes(found)
          manifest = {
              'schema': 'gemma4-yv-a593-frozen-corpus-v0',
              'candidate_id': 'YV-A593-Gemma4-26B-sequence-expansion-v0',
              'teacher_model': 'gemma-4-26b-a4b-it',
              'rows': 593,
              'phrases': 4744,
              'sha256': expected,
              'recovery': 'exact frozen-byte reconstruction from historical GitHub Actions artifacts; hash-gated; no model regeneration',
              'recovered_from': provenance,
          }
          (out / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY
          test "$(sha256sum research/enrichment/v31/gemma4-yv-a593/phrases.jsonl | cut -d' ' -f1)" = "$EXPECTED_SHA"
      - name: Freeze recovered corpus and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/recover-a593-teacher-once.yml
          git add research/enrichment/v31/gemma4-yv-a593 .github/workflows/recover-a593-teacher-once.yml
          git commit -m 'research: recover frozen A593 teacher corpus'
          git push
