name: Probe Pareto demand signals

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-pareto-demand.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe aggregate demand APIs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pareto-demand-probe
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          from pathlib import Path

          out = Path('artifacts/pareto-demand-probe')
          summary = {}

          def get(name, base, params=None):
              url = base
              if params:
                  url += '?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={'Accept':'application/json','User-Agent':'semantic-taxonomy-search-pareto-probe/0.3'})
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      body = r.read()
                      summary[name] = {'url': url, 'status': r.status, 'bytes': len(body)}
                      (out / f'{name}.json').write_bytes(body)
              except Exception as exc:
                  summary[name] = {'url': url, 'error': repr(exc)}

          get('jobsearch_occupation_name_stats', 'https://jobsearch.api.jobtechdev.se/search', [('limit','1'), ('stats','occupation-name'), ('stats.limit','30')])
          get('jobsearch_swagger', 'https://jobsearch.api.jobtechdev.se/swagger.json')
          get('historical_swagger', 'https://historical.api.jobtechdev.se/swagger.json')
          get('historical_occupation_name_stats', 'https://historical.api.jobtechdev.se/stats', [('taxonomy-type','occupation-name'), ('stats-by','concept_id'), ('limit','10000')])
          get('historical_skill_stats', 'https://historical.api.jobtechdev.se/stats', [('taxonomy-type','skill'), ('stats-by','concept_id'), ('limit','10000')])
          get('historical_occ_and_skill_stats', 'https://historical.api.jobtechdev.se/stats', [('taxonomy-type','occupation-name'), ('taxonomy-type','skill'), ('stats-by','concept_id'), ('limit','10000')])

          (out / 'probe-summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True))
          PY
      - name: Summarize demand distributions
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          out=Path('artifacts/pareto-demand-probe')
          summary={}

          def walk(obj, depth=0):
              if depth>4: return None
              if isinstance(obj,dict): return {k:walk(v,depth+1) for k,v in list(obj.items())[:20]}
              if isinstance(obj,list): return [walk(v,depth+1) for v in obj[:5]]
              return obj

          for p in sorted(out.glob('*_stats.json')):
              try: doc=json.loads(p.read_text(encoding='utf-8'))
              except Exception as exc:
                  summary[p.name]={'error':repr(exc)}; continue
              summary[p.name]={'shape_sample':walk(doc)}
          (out/'distribution-shape-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2,sort_keys=True)[:20000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pareto-demand-probe
          path: artifacts/pareto-demand-probe/
          if-no-files-found: error
          retention-days: 7
