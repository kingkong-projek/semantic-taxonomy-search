name: Pinned KV description baseline

on:
  push:
    branches: [main]
    paths:
      - scripts/evaluate_pinned_kv_selector_description_baseline.mjs
      - research/benchmark/v31/training-skill-fresh-holdout/**
      - .github/workflows/pinned-kv-description-baseline.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact pinned fuzzy dependency in isolated script scope
        run: |
          printf '{"private":true,"type":"module"}\n' > scripts/package.json
          npm install --prefix scripts --no-package-lock --no-save fuse.js@7.5.0
      - name: Replay pinned no-context KV search on blind descriptions
        run: node scripts/evaluate_pinned_kv_selector_description_baseline.mjs --output artifacts/pinned-kv-selector-description-baseline-v31.json
      - name: Guard source and benchmark boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/pinned-kv-selector-description-baseline-v31.json').read_text())
          assert r['pinned_selector']['commit']=='0eba98e3a91079a43c1eaf6da09dfabe11e5bc8b'
          assert r['pinned_selector']['fuse_js_version']=='7.5.0'
          assert r['source']['sha256']=='da83f26bf316971caa407364d8feae6f791203bff5758e674cace3d919e4b524'
          assert r['cases']==35
          print(json.dumps({k:r[k] for k in ('cases','skill_catalog_count','top1_pct','weighted_top1_pct','discovery_hit_at_5_pct','weighted_discovery_hit_at_5_pct','no_result_cases','no_result_pct')},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-kv-description-baseline-v31
          path: artifacts/pinned-kv-selector-description-baseline-v31.json
          if-no-files-found: error
          retention-days: 30
