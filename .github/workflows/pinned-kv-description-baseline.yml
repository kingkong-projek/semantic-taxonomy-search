name: Pinned KV description baseline

on:
  push:
    branches: [main]
    paths:
      - scripts/evaluate_pinned_kv_selector_description_baseline.mjs
      - research/benchmark/v31/training-skill-fresh-holdout/**
      - .github/workflows/pinned-kv-description-baseline.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard frozen blind holdout bytes
        run: |
          echo '79816eb2020b100bf8260b8f1807069288c30dbabd457bfffbfe3f49735c6675  research/benchmark/v31/training-skill-fresh-holdout/cases.jsonl' | sha256sum --check --strict
      - name: Install exact pinned fuzzy dependency in isolated script scope
        run: |
          printf '{"private":true,"type":"module"}\n' > scripts/package.json
          npm install --prefix scripts --no-package-lock --no-save fuse.js@7.5.0
      - name: Replay pinned no-context KV search on blind descriptions
        run: node scripts/evaluate_pinned_kv_selector_description_baseline.mjs --output artifacts/pinned-kv-selector-description-baseline-v31.json
      - name: Guard source and benchmark boundaries
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('artifacts/pinned-kv-selector-description-baseline-v31.json','utf8'));
          if(r.pinned_selector.commit!=='0eba98e3a91079a43c1eaf6da09dfabe11e5bc8b') throw new Error('selector commit drift');
          if(r.pinned_selector.fuse_js_version!=='7.5.0') throw new Error('Fuse version drift');
          if(r.source.sha256!=='da83f26bf316971caa407364d8feae6f791203bff5758e674cace3d919e4b524') throw new Error('KV source drift');
          if(r.cases!==35) throw new Error('benchmark count drift');
          const keys=['cases','skill_catalog_count','top1_pct','weighted_top1_pct','discovery_hit_at_5_pct','weighted_discovery_hit_at_5_pct','no_result_cases','no_result_pct'];
          console.log(JSON.stringify(Object.fromEntries(keys.map(k=>[k,r[k]])),null,2));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-kv-description-baseline-v31
          path: artifacts/pinned-kv-selector-description-baseline-v31.json
          if-no-files-found: error
          retention-days: 30
