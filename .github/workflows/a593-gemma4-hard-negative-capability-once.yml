name: A593 Gemma hard-negative capability once

on:
  push:
    paths:
      - .github/workflows/a593-gemma4-hard-negative-capability-once.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile-check probe
        run: >-
          python -m py_compile
          scripts/generate_gemma4_yv_teacher_pilot.py
          scripts/generate_gemma4_yv_sniper_contrasts.py
          scripts/test_gemma4_hard_negative_capability.py
      - name: Run four-pair explicit hard-negative capability probe
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: >-
          python scripts/test_gemma4_hard_negative_capability.py
          --pairs 4
          --requests-per-minute 3
      - name: Freeze probe and self-remove
        run: |
          test -s research/evaluation/v31/gemma4-explicit-hard-negative-capability-v0.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/a593-gemma4-hard-negative-capability-once.yml
          git add research/evaluation/v31/gemma4-explicit-hard-negative-capability-v0.json .github/workflows/a593-gemma4-hard-negative-capability-once.yml
          git commit -m 'research: freeze Gemma hard-negative capability probe'
          git fetch origin main
          git rebase origin/main
          git push
