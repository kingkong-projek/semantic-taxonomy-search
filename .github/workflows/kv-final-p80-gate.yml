name: KV final untouched P80 gate

on:
  push:
    branches: [main]
    paths:
      - 'scripts/evaluate_kv_final_p80_gate.py'
      - 'research/benchmark/v31/model-authored-kv-ranks301-316/**'
      - 'research/enrichment/v31/model-teacher-kv-ranks301-316/**'
      - '.github/workflows/kv-final-p80-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run first retrieval on frozen final P80 slice
        run: python scripts/evaluate_kv_final_p80_gate.py
      - name: Upload frozen raw evaluation
        uses: actions/upload-artifact@v4
        with:
          name: kv-final-p80-gate-v31
          path: artifacts/kv-final-p80-gate-v31.json
          if-no-files-found: error
          retention-days: 30
