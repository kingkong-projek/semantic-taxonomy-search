name: P80 display lane calibration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p80-display-lane-calibration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile-check
        run: python -m py_compile scripts/evaluate_p80_display_lane_calibration.py
      - name: Run lane-aware calibration
        run: python scripts/evaluate_p80_display_lane_calibration.py
      - name: Freeze result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/evaluation/v31/p80-display-lane-calibration-v0.json
          git commit -m 'research: freeze P80 lane-aware display calibration'
          git push
