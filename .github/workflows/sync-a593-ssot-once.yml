name: Sync A593 checkpoint into SSOT once

on:
  push:
    paths:
      - .github/workflows/sync-a593-ssot-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch SSOT with frozen A593 result
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/research-plan.md')
          text = path.read_text(encoding='utf-8')
          marker = "Evidence: `research/evaluation/v31/compile-time-semantic-tournament-a149.json`.\n"
          if marker not in text:
              raise RuntimeError('A149 evidence marker missing; refusing ambiguous SSOT patch')
          if 'A593 coverage checkpoint' in text:
              raise RuntimeError('A593 checkpoint already present')
          addition = """
          
          **A593 coverage checkpoint — `YV-A593-Gemma4-26B-sequence-expansion-v0` (2026-09-08): CONTINUE A TO FULL COVERAGE, BUT COVERAGE ALONE IS NOT ENOUGH.** The frozen A149 corpus and the successful portion of the next 450-request batch merge to **593 unique occupation identities / 4,744 teacher phrases**; the checkpoint is A593 rather than A600 because the original pilot had one invalid response and the new batch had six format-invalid 7/9-phrase responses. The compact teacher map is **68,317 bytes gzip-9** (217,332 raw), with a still-only-linear full-2,105 projection of **242,508 bytes gzip**. On the same already-opened 40 targetable YV stress cases, baseline -> A149 -> A593 is **18/40 -> 24/40 -> 26/40 Hit@5** and **9/40 -> 12/40 -> 15/40 Top1**. A593 category Hit@5 is direct **12/12**, colloquial **3/12**, noisy **7/8**, indirect **4/8**. Teacher family coverage has meanwhile risen to **34/40** targetable cases (direct 11/12, colloquial 11/12, noisy 6/8, indirect 6/8), versus 20/40 at A149. Thus fourteen additional covered stress families buy only two additional Hit@5 successes, both in the direct stratum; colloquial/noisy/indirect Hit@5 do not improve from A149. This is the first clear evidence that the remaining hard residual is increasingly a **discrimination/ranking problem, not merely missing positive teacher coverage**. On the strict source-attested 17, A593 reaches **10/17 Hit@5, 5/17 Top1, MRR 0.424510** versus A149 **9/17, 6/17, 0.443722** and baseline **9/17, 6/17, 0.418849**: recall improves by one while rank quality adds noise. Canonical source-truth remains **333/333 Hit@5** and **331/333 Top1** in the raw description ranker; ordinary Track-1 lookup remains separate and unchanged. Negative/abstention buckets remain unchanged. **Execution decision:** complete the deliberately unpruned teacher corpus across all 2,105 active YV identities, including an explicit retry pass for the seven currently invalid/missing teacher identities, then run the frozen A2105 falsification. Do not tune on the opened 17/88 suites. If the hard paraphrase residual persists at full coverage, the next A work is hard-negative/confusable discrimination plus pruning/down-weighting and abstention work, not another blind coverage expansion. Chunking remains unjustified by measured bytes. Evidence: `research/evaluation/v31/compile-time-semantic-tournament-a593.json`.
          """
          addition = '\n'.join(line[10:] if line.startswith('          ') else line for line in addition.splitlines()) + '\n'
          path.write_text(text.replace(marker, marker + addition, 1), encoding='utf-8')
          PY
      - name: Commit SSOT and remove one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/sync-a593-ssot-once.yml
          git add docs/research-plan.md .github/workflows/sync-a593-ssot-once.yml
          git commit -m 'docs: record A593 coverage checkpoint'
          git push
