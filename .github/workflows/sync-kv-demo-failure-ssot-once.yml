name: Sync exploratory KV demo failure SSOT once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-kv-demo-failure-ssot-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch research-plan SSOT
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/research-plan.md')
          text = path.read_text(encoding='utf-8')
          anchor = "Therefore **plain G1+T3 is the current simple research boundary and no higher model class is justified now**. Stop retrieval micro-optimization until new independent human/user evidence or a measured product failure identifies a material residual. The next evidence priority is the bounded product hypothesis itself: whether users who fail ordinary lexical lookup can describe tasks/tools/methods/responsibilities well enough to recognise and select the intended canonical candidate from a small fallback result set."
          addition = """\n\n**Exploratory demo failure evidence (2026-09-07): the stop condition has now been met for a bounded KV ranking/calibration investigation.** One explicitly exported tester session contained 21 submissions / 19 unique descriptions and exposed several trust-breaking rank orders, including plausible task descriptions where a related candidate appeared below obviously unrelated top results. This session is opened, non-preregistered product evidence and MUST NOT be reported as blind human accuracy or used as a tuning holdout. It does falsify the assumption that Hit@5 alone is sufficient for product quality: a rank-3 hit can coexist with unusable rank 1–2 results. Simple matched-term coverage is also insufficient as a confidence gate because some visibly bad rankings matched all unique query terms. The next bounded retrieval work is therefore diagnostics plus conservative ranking/abstention gating, evaluated on a newly frozen independent description set; do not tune directly to the 19 opened descriptions and do not escalate model class without that evidence. Evidence: `docs/findings/kv-demo-exploratory-field-failures-2026-09-07.md`."""
          if addition.strip() in text:
              print('SSOT already contains exploratory demo failure status')
          else:
              if text.count(anchor) != 1:
                  raise SystemExit(f'expected exactly one SSOT anchor, found {text.count(anchor)}')
              text = text.replace(anchor, anchor + addition)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Verify patch
        run: |
          grep -F 'Exploratory demo failure evidence (2026-09-07)' docs/research-plan.md
          grep -F 'docs/findings/kv-demo-exploratory-field-failures-2026-09-07.md' docs/research-plan.md
          git diff --check
      - name: Commit SSOT update
        run: |
          if git diff --quiet; then
            echo 'No SSOT diff to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research-plan.md
          git commit -m 'docs: sync exploratory KV demo failure evidence'
          git push
