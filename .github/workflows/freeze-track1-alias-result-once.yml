name: Freeze Track 1 alias result once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/freeze-track1-alias-result-once.yml

permissions:
  contents: write

jobs:
  freeze:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Freeze current-YV replay, alias result, finding and SSOT
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          # 1) Make the successful runtime patch to the should-find replay permanent.
          p=Path('scripts/evaluate_findability_should_find.mjs')
          s=p.read_text(encoding='utf-8')
          reps=[
            (
              'current search.utils.ts deduplicates fuzzy candidates by job-title id,\n * while contextual rows share that id. Exact/direct search does not have this issue.',
              'current search.utils.ts preserves fuzzy candidates by contextual row identity\n * (`job-title id + occupation-name id`), matching current production.'
            ),
            (
              "function rowKey(r){return `${r.id}|${r.occupation_name_id??''}`;}\n",
              "function rowKey(r){return `${r.id}|${r.occupation_name_id??''}`;}\nfunction searchIdentity(r){return r.type==='job-title'?`${r.id}|${r.occupation_name_id??''}`:r.id;}\n"
            ),
            (
              "    // IMPORTANT: mirror production exactly. Fuzzy dedupe is by item.id, not contextual row key.\n    const processedIds=new Set();\n    for(const fr of raw){if(processedIds.has(fr.item.id))continue;const rs=fr.score??1,base=1-rs;if(base<MIN_FUZZY_SCORE)continue;if(rs>best+.12)continue;const root=rootMatch(q,norm(fr.item.preferred_label));if(root&&rs<=.25)strong=true;let score=base*.70+Number(fr.item.weight??0)*.10+(root?.12:0);score=Math.min(MAX_FUZZY_SCORE,Math.max(MIN_FUZZY_SCORE,score));candidates.push({...fr.item,score,displayLabel:displayLabel(fr.item)});processedIds.add(fr.item.id);}",
              "    // IMPORTANT: mirror current production exactly. Fuzzy dedupe preserves each published job-title context row.\n    const processedIdentities=new Set();\n    for(const fr of raw){const identity=searchIdentity(fr.item);if(processedIdentities.has(identity))continue;const rs=fr.score??1,base=1-rs;if(base<MIN_FUZZY_SCORE)continue;if(rs>best+.12)continue;const root=rootMatch(q,norm(fr.item.preferred_label));if(root&&rs<=.25)strong=true;let score=base*.70+Number(fr.item.weight??0)*.10+(root?.12:0);score=Math.min(MAX_FUZZY_SCORE,Math.max(MIN_FUZZY_SCORE,score));candidates.push({...fr.item,score,displayLabel:displayLabel(fr.item)});processedIdentities.add(identity);}" 
            ),
            (
              "selector_contract:{yv_search_utils_blob:'711769d019d01539b958776467e42dbafa46d9c1',yv_constants_blob:'e9a412778d77de1aef82da94e36559619f5d607c',fuse_js_version:FUSE_VERSION,yv_fuzzy_dedupe_key:'job-title id'}",
              "selector_contract:{yv_repository_commit:'ab0b3f28576d8aebec2b593b771a70c7684b1eca',yv_search_utils_blob:'1eb706399ff97634b556164061e651a024b98003',yv_constants_blob:'e9a412778d77de1aef82da94e36559619f5d607c',fuse_js_version:FUSE_VERSION,yv_fuzzy_dedupe_key:'job-title id + occupation-name context'}"
            ),
          ]
          for old,new in reps:
              if old not in s:
                  raise RuntimeError(f'evaluator anchor missing: {old[:90]}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # 2) Keep alias ambiguity visible whenever the source-attested packet is rebuilt.
          p=Path('scripts/build_findability_should_find_cases.py')
          s=p.read_text(encoding='utf-8')
          old='''    grouped: dict[tuple[str, str], list[dict[str, Any]]] = collections.defaultdict(list)\n    for row in surfaces:\n        grouped[(row["product"], norm(row["query"]))].append(row)\n\n    occurrence: dict[str, int] = {}\n'''
          new='''    grouped: dict[tuple[str, str], list[dict[str, Any]]] = collections.defaultdict(list)\n    for row in surfaces:\n        grouped[(row["product"], norm(row["query"]))].append(row)\n\n    canonical_alias_groups: dict[tuple[str, str], list[dict[str, Any]]] = collections.defaultdict(list)\n    for row in surfaces:\n        if row["surface_provenance"] in {"canonical_alternative_label", "canonical_hidden_label"}:\n            canonical_alias_groups[(row["product"], norm(row["query"]))].append(row)\n    canonical_alias_surface_collisions: dict[str, dict[str, int | float]] = {}\n    for product in ("YV", "KV"):\n        groups=[rows for (p,_),rows in canonical_alias_groups.items() if p==product]\n        unique=[rows for rows in groups if len({(str(r["target_type"]),str(r["target_id"])) for r in rows})==1]\n        ambiguous=[rows for rows in groups if len({(str(r["target_type"]),str(r["target_id"])) for r in rows})>1]\n        canonical_alias_surface_collisions[product]={\n            "distinct_normalized_surfaces":len(groups),\n            "unique_target_surfaces":len(unique),\n            "ambiguous_target_surfaces":len(ambiguous),\n            "ambiguous_target_surface_pct":round(100.0*len(ambiguous)/len(groups),3) if groups else 0.0,\n        }\n\n    occurrence: dict[str, int] = {}\n'''
          if old not in s:
              raise RuntimeError('builder grouped anchor missing')
          s=s.replace(old,new,1)
          old='''        "counts": {\n            "all_cases": len(cases),\n'''
          new='''        "canonical_alias_surface_collisions": canonical_alias_surface_collisions,\n        "counts": {\n            "all_cases": len(cases),\n'''
          if old not in s:
              raise RuntimeError('builder manifest anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # 3) Freeze the compact decision-bearing result from successful Actions run 34045443253.
          result={
            "schema_version": 1,
            "taxonomy_version": 31,
            "track": "1-current-yv-kv-findability",
            "source_run_id": 34045443253,
            "source_artifact_id": 9993147225,
            "source_artifact_sha256": "1970e3b0218bc356911c975d70feff76a60b2af59019dba0d7d2b8036f7be797",
            "selector_contract": {
              "yv_repository_commit": "ab0b3f28576d8aebec2b593b771a70c7684b1eca",
              "yv_search_utils_blob": "1eb706399ff97634b556164061e651a024b98003",
              "yv_constants_blob": "e9a412778d77de1aef82da94e36559619f5d607c",
              "fuse_js_version": "7.5.0",
              "yv_fuzzy_dedupe_key": "job-title id + occupation-name context"
            },
            "intervention": "exact normalized current canonical alternative/hidden-label lane before fuzzy; ambiguous alias surfaces must not force a unique target",
            "alias_surface_ambiguity": {
              "YV": {"distinct":362,"unique_target":361,"ambiguous":1,"ambiguous_pct":0.276},
              "KV": {"distinct":1317,"unique_target":1289,"ambiguous":28,"ambiguous_pct":2.126}
            },
            "YV": {
              "strict_unique_alias_cases":357,
              "current_hit_at_5":318,
              "current_hit_at_5_pct":89.076,
              "current_miss_at_5":39,
              "current_no_result_cases":0,
              "observed_exact_query_volume":95842570,
              "current_observed_volume_hit_at_5_pct":98.578,
              "deterministic_exact_alias_rescue_cases":39,
              "rescued_observed_exact_query_volume":1362861,
              "rescued_observed_exact_query_volume_pct":1.422,
              "post_alias_hit_at_5_pct":100.0
            },
            "KV": {
              "strict_unique_alias_cases":1278,
              "current_hit_at_5":1056,
              "current_hit_at_5_pct":82.629,
              "current_miss_at_5":222,
              "current_no_result_cases":179,
              "target_occurrence_proxy":36865,
              "current_target_occurrence_proxy_hit_at_5_pct":49.098,
              "deterministic_exact_alias_rescue_cases":222,
              "rescued_target_occurrence_proxy":18765,
              "rescued_target_occurrence_proxy_pct":50.902,
              "post_alias_hit_at_5_pct":100.0
            },
            "fuzzy_context_structural_stress": {"eligible_multi_context_titles":539,"all_contexts_preserved":538,"all_contexts_preserved_pct":99.814,"one_context_only":0},
            "authority_boundary": "Only current canonical alternative/hidden labels are evaluated as same-concept vocabulary. Deprecated replaced_by labels remain migration/history route evidence and are not promoted to synonyms."
          }
          out=Path('research/evaluation/v31/track1-canonical-alias-rescue.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')

          finding='''# Track 1 canonical alias reachability — taxonomy v31\n\n## Decision\n\nA small deterministic lane for **current canonical alternative/hidden labels** is justified before adding semantic complexity. It should run before fuzzy matching and preserve the canonical concept identity. Ambiguous alias surfaces must not silently force a single target.\n\nThis is not permission to treat `replaced_by` history as synonymy. Deprecated labels remain migration/history routing evidence because terms such as broad historical labels can legitimately collide with current concrete occupations.\n\n## Measured current baseline\n\nThe replay is pinned to `kingkong-projek/yrkesvaljaren@ab0b3f28576d8aebec2b593b771a70c7684b1eca`, including contextual fuzzy identity (`job-title id + occupation-name context`). The measurement ran successfully on self-hosted `garderob` as Actions run `34045443253`.\n\n| | YV | KV |\n|---|---:|---:|\n| distinct canonical alias surfaces | 362 | 1,317 |\n| ambiguous across targets | 1 (0.276%) | 28 (2.126%) |\n| strict unique alias cases | 357 | 1,278 |\n| current hit@5 | 318 (89.076%) | 1,056 (82.629%) |\n| deterministic exact-alias rescues | **39** | **222** |\n| post-lane hit@5 on strict unique aliases | **100%** | **100%** |\n\nYV already handles canonical alias traffic well. Within YV alias cases that occur exactly in the pinned query corpus, current hit@5 is **98.578% by observed volume**. The 39 deterministic rescues account for **1,362,861 searches / 1.422%** of that alias-set volume.\n\nKV has a much larger cheap residual. The 222 deterministic rescues account for **18,765 / 50.902%** of the Historical-API target-occurrence proxy mass represented by the remaining unique-alias failures. This proxy prioritises work; it is not user query intent.\n\nExamples include `Microsoft Office`/`Officepaketet` → `MS Office`, `Legitimation som sjukgymnast` → `Legitimation som fysioterapeut`, and JavaScript competence/knowledge variants → `JavaScript, programmeringsspråk`.\n\n## Product implication\n\nImplement current canonical aliases as a privileged deterministic lexical lane. Keep preferred labels and existing search behaviour intact, preserve all product admission rules, and fail closed on alias ambiguity instead of guessing. Re-run the same packet after the product patch.\n\nThe result supports the broader Track-1 hypothesis: YV may already be strong for ordinary known-name lookup, while KV has a material vocabulary gap that does not require semantic retrieval to fix. Neither result removes the separate need for free-text semantic fallback when the user does not know the occupational/competence term.\n\nStructured result: `research/evaluation/v31/track1-canonical-alias-rescue.json`.\n'''
          Path('docs/findings/track1-canonical-alias-reachability-v31.md').write_text(finding,encoding='utf-8')

          # 4) Sync SSOT: current YV pin + measured Track-1 decision.
          p=Path('docs/research-plan.md')
          s=p.read_text(encoding='utf-8')
          old='kingkong-projek/yrkesvaljaren@0eba98e3a91079a43c1eaf6da09dfabe11e5bc8b'
          new='kingkong-projek/yrkesvaljaren@ab0b3f28576d8aebec2b593b771a70c7684b1eca'
          if old not in s:
              raise RuntimeError('stale current-YV pin anchor missing')
          s=s.replace(old,new,1)
          anchor='### 2.1.2 Persona-based experiential red-team\n'
          if anchor not in s:
              raise RuntimeError('Track 1 persona anchor missing')
          update='''**Track 1 status — canonical alias reachability measured (2026-09-06).** Against current YV `ab0b3f28576d8aebec2b593b771a70c7684b1eca`, current canonical alternative/hidden labels are overwhelmingly unambiguous (YV 361/362 unique-target surfaces; KV 1,289/1,317). The current selector already finds 318/357 strict YV alias cases and 1,056/1,278 KV cases at 5. A privileged exact-normalized current-alias lane would deterministically rescue the remaining **39 YV** and **222 KV** strict cases, reaching 100% on that bounded set. The YV increment is modest by observed alias-query volume (**1.422%**); the KV increment is materially larger by the available target-occurrence priority proxy (**50.902%** of the alias-set proxy mass rescued). Therefore the next cheapest Track-1 intervention is to implement current canonical aliases before any semantic expansion. Alias collisions fail closed / remain multi-candidate; deprecated `replaced_by` labels are explicitly excluded from synonym treatment. Evidence: `docs/findings/track1-canonical-alias-reachability-v31.md` and `research/evaluation/v31/track1-canonical-alias-rescue.json`.\n\n'''
          s=s.replace(anchor,update+anchor,1)
          p.write_text(s,encoding='utf-8')
          PY

          python3 -m py_compile scripts/build_findability_should_find_cases.py scripts/analyze_canonical_alias_rescue.py
          grep -q "yv_repository_commit:'ab0b3f28576d8aebec2b593b771a70c7684b1eca'" scripts/evaluate_findability_should_find.mjs
          grep -q 'rescued_observed_exact_query_volume_pct' research/evaluation/v31/track1-canonical-alias-rescue.json
          grep -q 'Track 1 status — canonical alias reachability measured' docs/research-plan.md

      - name: Commit frozen Track 1 state and remove one-offs
        run: |
          git rm -f .github/workflows/track1-canonical-alias-ablation-once.yml
          git rm -f .github/workflows/freeze-track1-alias-result-once.yml
          git add scripts/evaluate_findability_should_find.mjs \
                  scripts/build_findability_should_find_cases.py \
                  research/evaluation/v31/track1-canonical-alias-rescue.json \
                  docs/findings/track1-canonical-alias-reachability-v31.md \
                  docs/research-plan.md
          git diff --cached --check
          git config user.name semantic-taxonomy-search-bot
          git config user.email semantic-taxonomy-search-bot@users.noreply.github.com
          git commit -m 'research: freeze Track 1 canonical alias decision'
          git pull --rebase origin main
          git push origin HEAD:main
