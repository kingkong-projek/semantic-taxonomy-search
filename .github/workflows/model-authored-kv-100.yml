name: Model-authored KV-100 stress test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/benchmark/v31/model-authored-kv-100/**'
      - 'research/enrichment/v31/model-teacher-kv-top100/**'
      - 'scripts/evaluate_model_authored_kv_100.py'
      - 'scripts/build_model_authored_kv_100_review_context.py'
      - 'scripts/evaluate_model_teacher_kv_top100.py'
      - '.github/workflows/model-authored-kv-100.yml'

jobs:
  evaluate:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evaluate synthetic KV descriptions
        run: python scripts/evaluate_model_authored_kv_100.py
      - name: Build canonical adjudication context
        run: python scripts/build_model_authored_kv_100_review_context.py
      - name: Probe model-teacher build-time language
        run: python scripts/evaluate_model_teacher_kv_top100.py
      - uses: actions/upload-artifact@v4
        with:
          name: model-authored-kv-100-v31
          path: |
            artifacts/model-authored-kv-100-v31.json
            artifacts/model-authored-kv-100-review-context-v31.json
            artifacts/model-teacher-kv-top100-v31.json
          if-no-files-found: error
          retention-days: 30
