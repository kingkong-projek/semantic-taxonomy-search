name: Patch v1 Python bool literals

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v1-python-bools.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fix execution-only Python boolean literals
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/evaluate_semantic_display_hard_confusion_v1.py')
          s = p.read_text(encoding='utf-8')
          old = s
          s = s.replace('"opened_17_88_loaded": false,', '"opened_17_88_loaded": False,')
          s = s.replace('"raw_query_text_committed": false,', '"raw_query_text_committed": False,')
          if s == old:
              raise SystemExit('expected lowercase bool literals not found')
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile scripts/evaluate_semantic_display_hard_confusion_v1.py
      - name: Commit correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/evaluate_semantic_display_hard_confusion_v1.py
          git commit -m 'fix: correct v1 evaluator Python bool literals'
          git pull --rebase origin main
          git push
