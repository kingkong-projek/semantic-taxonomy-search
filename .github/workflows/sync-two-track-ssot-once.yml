name: Sync two-track research order once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-two-track-ssot-once.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/sync_two_track_ssot_once.py
      - name: Validate and commit
        run: |
          grep -Fq 'Track 1 — current YV/KV findability (NOW)' docs/research-plan.md
          grep -Fq 'Track 2 — free-text description fallback (PAUSED)' docs/research-plan.md
          grep -Fq 'must not be replayed or used to choose retrieval changes during Track 1' docs/research-plan.md
          git diff --check
          git config user.name semantic-taxonomy-search-bot
          git config user.email semantic-taxonomy-search-bot@users.noreply.github.com
          git add docs/research-plan.md
          git commit -m 'research: run current-selector track before free-text'
          git push origin HEAD:main
