name: Align human study occupation universe once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-human-occupation-universe-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch validator, self-test and operator docs fail-closed
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            'scripts/validate_human_description_study.py': [
              (
                """        targets = validate_targets(row['acceptable_targets'], f'adjudication:{case_id}')\n        if row['status'] == 'mapped' and len(targets) != 1:\n""",
                """        targets = validate_targets(row['acceptable_targets'], f'adjudication:{case_id}')\n        stream = elicitation[case_id]['stream']\n        if stream == 'occupation' and any(\n            target['in_frozen_demand_envelope'] is not True for target in targets\n        ):\n            raise RuntimeError(\n                f'adjudication:{case_id}: active v31 occupation-name targets are all inside the frozen occupation capability universe'\n            )\n        if row['status'] == 'mapped' and len(targets) != 1:\n""",
              ),
            ],
            'scripts/selftest_human_description_study.py': [
              (
                """        expect_failure('mapped exactly one target', lambda: validator.validate_adjudication(bad_mapped, elicitation))\n\n        bad_outcomes = validator.load_jsonl(outcomes_path)\n""",
                """        expect_failure('mapped exactly one target', lambda: validator.validate_adjudication(bad_mapped, elicitation))\n\n        bad_occ_envelope = copy.deepcopy(adjudication_rows)\n        bad_occ_envelope[0]['acceptable_targets'][0]['in_frozen_demand_envelope'] = False\n        expect_failure(\n            'occupation full-universe envelope',\n            lambda: validator.validate_adjudication(bad_occ_envelope, elicitation),\n        )\n\n        bad_outcomes = validator.load_jsonl(outcomes_path)\n""",
              ),
            ],
            'research/human/description-fallback-v1/README.md': [
              (
                """Envelope membership is stored **per target**. This matters when an ambiguous description has one defensible identity inside P80 and another outside it. Never invent a single target merely to make Hit@5 calculable.""",
                """The legacy `in_frozen_demand_envelope` field is stored **per target**, but its meaning is stream-specific. For `skill`, it records membership in the frozen 316-skill P80 capability envelope and mixed inside/outside ambiguous cases are valid. For `occupation`, the frozen capability universe is all **2,105 active v31 `occupation-name` identities**, so every valid active occupation target must set the field to `true`; P80/non-P80 is a separate demand-priority reporting stratum. Never coerce a valid non-P80 occupation to the nearest P80 identity merely to make Hit@5 calculable.""",
              ),
              (
                """The staged validator enforces stage separation, hash freezes, unique IDs, per-target envelope semantics and adjudication/outcome invariants.""",
                """The staged validator enforces stage separation, hash freezes, unique IDs, stream-specific per-target capability-universe semantics and adjudication/outcome invariants.""",
              ),
            ],
            'research/human/description-fallback-v1/adjudicator-instructions.md': [
              (
                """Envelope-medlemskap bedöms per mål mot den redan frusna P80-inventeringen. Ett tvetydigt fall kan därför ha ett mål innanför och ett utanför envelopen.""",
                """Fältet `in_frozen_demand_envelope` har stream-specifik betydelse. För `skill` bedöms medlemskap per mål mot den frusna 316-kompetensers P80-envelopen; ett tvetydigt skill-fall kan därför ha mål både innanför och utanför. För `occupation` är capability-universumet alla **2 105 aktiva v31 `occupation-name`**. Varje giltigt aktivt occupation-mål ska därför ha `in_frozen_demand_envelope: true`; P80/non-P80 noteras separat som efterfrågestratum och får inte avgöra om yrket är ett giltigt mål.""",
              ),
              (
                """- För skill-streamen får ett out-of-P80-mål inte ersättas av närmaste P80-kompetens.""",
                """- För skill-streamen får ett out-of-P80-mål inte ersättas av närmaste P80-kompetens.\n- För occupation-streamen får ett aktivt v31 `occupation-name` utanför P80 inte märkas som out-of-envelope eller ersättas av ett P80-yrke.""",
              ),
              (
                """Ett exploratory pilotfall kan ha en granskare. Ett fall som senare används som positiv evidens för att G1+T3/C2 är semantiskt otillräcklig bör få starkare oberoende adjudikering enligt den preregistrerade proceduren — före någon ny modell jämförs mot fallet.""",
                """Ett exploratory pilotfall kan ha en granskare. Ett fall som senare används som positiv evidens för att den frusna stream-specifika fallback-kandidaten är semantiskt otillräcklig bör få starkare oberoende adjudikering enligt den preregistrerade proceduren — före någon ny modell jämförs mot fallet.""",
              ),
            ],
          }

          for path_str, pairs in replacements.items():
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected one match, got {count}: {old[:100]!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Run human-study contract checks before commit
        run: |
          python -m py_compile \
            scripts/validate_human_description_study.py \
            scripts/selftest_human_description_study.py
          python scripts/check_human_description_contract_consistency.py
          python scripts/selftest_human_description_study.py
          python scripts/selftest_human_description_preregistration.py
          python scripts/selftest_human_description_scorecard.py
          python scripts/check_human_description_repository_state.py
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sync-human-occupation-universe-once.yml
          git add \
            scripts/validate_human_description_study.py \
            scripts/selftest_human_description_study.py \
            research/human/description-fallback-v1/README.md \
            research/human/description-fallback-v1/adjudicator-instructions.md
          git diff --cached --exit-code && exit 0
          git commit -m 'research: enforce full YV human-study universe'
          git push
