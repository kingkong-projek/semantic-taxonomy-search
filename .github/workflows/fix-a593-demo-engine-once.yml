name: Register A593 demo engine id

on:
  push:
    paths:
      - '.github/workflows/fix-a593-demo-engine-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register A593 on existing YV runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('demo/search-engine.js')
          s = p.read_text(encoding='utf-8')
          old = "  if (model.engine === 'YV-description-full-v0-canonical-router') return createYvEngine(model);"
          new = "  if (model.engine === 'YV-description-full-v0-canonical-router' || model.engine === 'YV-A593-Gemma4-26B-sequence-expansion-v0') return createYvEngine(model);"
          if old not in s:
              raise SystemExit('YV engine registration anchor drift')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit runtime registration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add demo/search-engine.js
          git commit -m 'demo: register frozen A593 engine id'
          git push
      - name: Dispatch tested A593 promotion from updated main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run promote-a593-demo-once.yml --ref main
