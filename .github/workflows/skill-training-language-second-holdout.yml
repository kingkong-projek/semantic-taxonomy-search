name: Skill training-language second holdout

on:
  push:
    branches: [main]
    paths:
      - scripts/evaluate_skill_training_language_second_holdout.py
      - scripts/evaluate_skill_training_language_enrichment.py
      - scripts/evaluate_skill_training_language_fusion.py
      - research/benchmark/v31/training-skill-second-holdout/**
      - research/benchmark/v31/training-skill-fresh-holdout/**
      - research/benchmark/v31/p80-source-truth/kv-p80-source-truth.jsonl
      - research/coverage/v31/pareto-demand-aggregate.json
      - research/coverage/source-adapters.json
      - .github/workflows/skill-training-language-second-holdout.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate predeclared 3-slot and 4-slot policies
        run: python scripts/evaluate_skill_training_language_second_holdout.py
      - uses: actions/upload-artifact@v4
        with:
          name: skill-training-language-second-holdout-v31
          path: artifacts/skill-training-language-second-holdout-v31.json
          if-no-files-found: error
          retention-days: 30
