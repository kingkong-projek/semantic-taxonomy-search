name: Skill simple fusion candidates

on:
  push:
    branches: [main]
    paths:
      - scripts/evaluate_skill_simple_fusion_candidates.py
      - scripts/evaluate_skill_esco_candidate_lanes.py
      - scripts/evaluate_skill_esco_fusion.py
      - scripts/evaluate_skill_native_selector_candidate_lanes.py
      - research/benchmark/v31/training-skill-validation/**
      - research/benchmark/v31/p80-source-truth/kv-p80-source-truth.jsonl
      - research/coverage/v31/pareto-demand-aggregate.json
      - research/coverage/v31/selector-aggregate.json
      - research/coverage/source-adapters.json
      - .github/workflows/skill-simple-fusion-candidates.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare one-slot candidates
        run: python scripts/evaluate_skill_simple_fusion_candidates.py --output artifacts/skill-simple-fusion-candidates-v31.json
      - name: Guard frozen canonical regression
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('artifacts/skill-simple-fusion-candidates-v31.json').read_text())
          for name,row in x['source_truth_regression'].items():
              assert row['top1_pct']==100.0, (name,row)
              assert row['discovery_hit_at_5_pct']==100.0, (name,row)
              assert row['failure_count']==0, (name,row)
          print(json.dumps({k:{'primary':v['primary_descriptive_nonleaky'],'lane_document_count':v['lane_document_count']} for k,v in x['candidates'].items()},ensure_ascii=False,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: skill-simple-fusion-candidates-v31
          path: artifacts/skill-simple-fusion-candidates-v31.json
          if-no-files-found: error
          retention-days: 30
