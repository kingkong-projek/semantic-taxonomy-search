name: Compact YV profile safety

on:
  push:
    branches: [main]
    paths:
      - scripts/build_compact_yv_profile_safety.py
      - scripts/validate_benchmark.py
      - research/coverage/source-adapters.json
      - research/coverage/v31/yv-query-language-aggregate.json
      - .github/workflows/compact-yv-profile-safety.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkout pinned Yrkesväljaren generator evidence
        env:
          YV_GENERATOR_COMMIT: 6dd9e4737d7db3cb2709f8082808b88e5c89ed6e
        run: |
          rm -rf /tmp/yv-generator
          git init -q /tmp/yv-generator
          git -C /tmp/yv-generator remote add origin https://gitlab.com/arbetsformedlingen/taxonomy-dev/backend/yrkesvaljaren.git
          git -C /tmp/yv-generator fetch -q --depth 1 origin "$YV_GENERATOR_COMMIT"
          git -C /tmp/yv-generator checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/yv-generator rev-parse HEAD)" = "$YV_GENERATOR_COMMIT"
          printf '%s\n' "$YV_GENERATOR_COMMIT" > /tmp/yv-generator/SOURCE_COMMIT.txt
      - name: Build compact safety slices
        run: |
          python scripts/build_compact_yv_profile_safety.py \
            --version 31 \
            --source-dir /tmp/yv-generator \
            --multi-parent-limit 20 \
            --excluded-limit 20 \
            --output-dir artifacts/compact-yv-profile-safety-v31
      - name: Validate auto-scored ambiguity cases and pending routing review
        run: |
          python scripts/validate_benchmark.py artifacts/compact-yv-profile-safety-v31/multi-parent-auto.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('artifacts/compact-yv-profile-safety-v31/excluded-routing-review.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          manifest=json.loads(Path('artifacts/compact-yv-profile-safety-v31/manifest.json').read_text(encoding='utf-8'))
          assert len(rows)==20
          assert manifest['multi_parent']['population']==541
          assert manifest['excluded_routing']['population']==205
          assert all(r['adjudication']['status']=='PENDING_HUMAN_REVIEW' for r in rows)
          assert all(not r['adjudication']['must'] and not r['adjudication']['acceptable'] and not r['adjudication']['must_not'] for r in rows)
          assert set(manifest['excluded_routing']['reason_counts']).issubset({'too_many_parents','redundant_label'})
          print('compact YV safety slices validated')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: compact-yv-profile-safety-v31
          path: artifacts/compact-yv-profile-safety-v31/
          if-no-files-found: error
          retention-days: 30
