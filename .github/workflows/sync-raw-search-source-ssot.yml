name: Sync raw-search source SSOT

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-raw-search-source-ssot.yml"
      - "scripts/sync_raw_search_source_ssot.py"

permissions:
  contents: write

jobs:
  sync:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply guarded SSOT update
        run: python scripts/sync_raw_search_source_ssot.py
      - name: Validate registry and expected SSOT markers
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool research/coverage/source-adapters.json >/dev/null
          grep -F "### 5.5.1 Raw public JobSearch Trends" docs/research-plan.md
          grep -F '"id": "jobsearch-trends-raw-daily"' research/coverage/source-adapters.json
          grep -F "Gate 1 is closed" docs/research-plan.md
      - name: Commit synchronized source boundary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kingkongola"
          git config user.email "adambergman90@gmail.com"
          git add docs/research-plan.md research/coverage/source-adapters.json
          if git diff --cached --quiet; then
            echo "No SSOT changes to commit"
            exit 0
          fi
          git commit -m "research: promote raw JobSearch Trends to Gate 2 source"
          git push origin HEAD:main
