name: P80 display precision opened audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p80-display-precision-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile-check audit
        run: python -m py_compile scripts/audit_p80_display_precision.py
      - name: Replay opened stress diagnostically
        run: python scripts/audit_p80_display_precision.py
      - name: Freeze diagnostic
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/evaluation/v31/p80-display-precision-opened-audit-v0.json
          git commit -m 'research: freeze P80 display-precision diagnostic'
          git push
