name: Sync current selector baseline scope

on:
  push:
    branches: [main]
    paths:
      - scripts/sync_current_selector_baseline_scope.py
      - .github/workflows/sync-current-selector-baseline-scope.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply guarded SSOT patch
        run: python scripts/sync_current_selector_baseline_scope.py
      - name: Verify key assertions
        run: |
          grep -F "Fallback-first product objective vs replacement potential" docs/research-plan.md
          grep -F "P  pinned current YV/KV production selector baseline" docs/research-plan.md
          grep -F "incremental Discovery Success@5 over the pinned current selector" docs/research-plan.md
      - name: Commit SSOT change
        run: |
          if git diff --quiet -- docs/research-plan.md; then
            echo "No SSOT change needed"
            exit 0
          fi
          git config user.name "semantic-taxonomy-research-bot"
          git config user.email "semantic-taxonomy-research-bot@users.noreply.github.com"
          git add docs/research-plan.md
          git commit -m "docs: make current selectors fallback baseline"
          git push origin HEAD:main
