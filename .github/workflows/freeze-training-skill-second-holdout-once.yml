name: Freeze second blind skill holdout once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/freeze-training-skill-second-holdout-once.yml

permissions:
  contents: write

jobs:
  freeze:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild and verify pre-frozen benchmark
        run: |
          python scripts/build_training_skill_second_holdout.py --output-dir research/benchmark/v31/training-skill-second-holdout
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('research/benchmark/v31/training-skill-second-holdout/cases.jsonl')
          got=hashlib.sha256(p.read_bytes()).hexdigest()
          expected='3960fd217deb9d7346fd78d4f281a62b614ce927e18e4ed12cbebec08a898aa7'
          if got != expected:
              raise SystemExit(f'holdout drift {got} != {expected}')
          PY
      - name: Commit frozen benchmark
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/benchmark/v31/training-skill-second-holdout/
          git diff --cached --quiet && exit 0
          git commit -m "research: freeze second blind skill-description holdout"
          git push
