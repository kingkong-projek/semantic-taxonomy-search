name: A593 raw plus stem diagnostic once

on:
  push:
    paths:
      - .github/workflows/a593-raw-plus-stem-once.yml

permissions:
  contents: write
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download frozen A593 corpus
        uses: actions/download-artifact@v4
        with:
          name: gemma-a593-checkpoint
          path: artifacts/a593
          github-token: ${{ github.token }}
          run-id: 34232985249
      - name: Compile-check diagnostic
        run: >-
          python -m py_compile
          scripts/evaluate_gemma_a593_phrase_representation.py
          scripts/evaluate_gemma_a593_raw_plus_stem.py
      - name: Evaluate raw plus stem on corpus-internal holdouts
        run: >-
          python scripts/evaluate_gemma_a593_raw_plus_stem.py
          --teacher artifacts/a593/gemma-a593-teacher.jsonl
          --output artifacts/a593-raw-plus-stem.json
      - name: Freeze result
        run: >-
          cp artifacts/a593-raw-plus-stem.json
          research/evaluation/v31/compile-time-semantic-a593-raw-plus-stem.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: a593-raw-plus-stem
          path: artifacts/a593-raw-plus-stem.json
      - name: Commit frozen result and self-remove
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/a593-raw-plus-stem-once.yml
          git add research/evaluation/v31/compile-time-semantic-a593-raw-plus-stem.json .github/workflows/a593-raw-plus-stem-once.yml
          git commit -m 'research: freeze A593 raw plus stem diagnostic'
          git push
