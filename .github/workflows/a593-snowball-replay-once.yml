name: A593 Snowball opened replay once
# retry after isolating stemming to the A593 lexical candidate only

on:
  push:
    paths:
      - .github/workflows/a593-snowball-replay-once.yml

permissions:
  contents: write
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download frozen A593 corpus
        uses: actions/download-artifact@v4
        with:
          name: gemma-a593-checkpoint
          path: artifacts/a593
          github-token: ${{ github.token }}
          run-id: 34232985249
      - name: Compile-check prefrozen candidate
        run: >-
          python -m py_compile
          scripts/evaluate_gemma_a593_phrase_representation.py
          scripts/evaluate_gemma_a593_snowball.py
      - name: Replay prefrozen A593 Snowball candidate
        run: >-
          python scripts/evaluate_gemma_a593_snowball.py
          --teacher artifacts/a593/gemma-a593-teacher.jsonl
          --output artifacts/gemma-a593-snowball-tournament.json
      - name: Freeze opened replay
        run: >-
          cp artifacts/gemma-a593-snowball-tournament.json
          research/evaluation/v31/compile-time-semantic-tournament-a593-snowball.json
      - name: Upload replay
        uses: actions/upload-artifact@v4
        with:
          name: gemma-a593-snowball-replay
          path: artifacts/gemma-a593-snowball-tournament.json
      - name: Commit frozen replay and self-remove
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/a593-snowball-replay-once.yml
          git add research/evaluation/v31/compile-time-semantic-tournament-a593-snowball.json .github/workflows/a593-snowball-replay-once.yml
          git commit -m 'research: freeze A593 Snowball opened replay'
          git push
