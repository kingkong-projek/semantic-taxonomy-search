name: Gemma A593 checkpoint once

on:
  push:
    paths:
      - .github/workflows/gemma-a593-checkpoint-once.yml

permissions:
  contents: write
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download frozen A149 teacher corpus
        uses: actions/download-artifact@v4
        with:
          name: gemma4-yv-teacher-hour-run
          path: artifacts/gemma-hour
          github-token: ${{ github.token }}
          run-id: 34189574629
      - name: Download frozen 150-599 teacher batch
        uses: actions/download-artifact@v4
        with:
          name: gemma4-yv-teacher-batch-150-599
          path: artifacts/gemma-batch
          github-token: ${{ github.token }}
          run-id: 34211545225
      - name: Merge frozen corpora by concept id
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          sources = [
              (
                  Path('artifacts/gemma-hour/gemma4-yv-teacher-hour-run.jsonl'),
                  '1a6e26840480d0cd6ffce23e3214d026cefa202397f4e84115e9fe2ac1e1045b',
              ),
              (
                  Path('artifacts/gemma-batch/gemma4-yv-teacher-batch-150-599.jsonl'),
                  '3649dd2d527e1192b887ee7a6a06f48a3d8abc2cba7c1ed7f9a9fbbf05445674',
              ),
          ]
          rows = []
          seen = set()
          for path, expected_sha in sources:
              raw = path.read_bytes()
              actual_sha = hashlib.sha256(raw).hexdigest()
              if actual_sha != expected_sha:
                  raise RuntimeError(f'frozen teacher source drift for {path}: {actual_sha}')
              for line in raw.decode('utf-8').splitlines():
                  if not line.strip():
                      continue
                  row = json.loads(line)
                  cid = str(row.get('concept_id') or '')
                  if not cid or cid in seen:
                      raise RuntimeError(f'missing/duplicate concept id: {cid}')
                  phrases = row.get('phrases') or []
                  if len(phrases) != 8:
                      raise RuntimeError(f'phrase-count drift for {cid}: {len(phrases)}')
                  seen.add(cid)
                  rows.append(row)
          if len(rows) != 593 or len(seen) != 593:
              raise RuntimeError(f'merged coverage drift: rows={len(rows)} unique={len(seen)}')
          out = Path('artifacts/gemma-a593-teacher.jsonl')
          out.write_text(
              ''.join(json.dumps(row, ensure_ascii=False, sort_keys=True, separators=(',', ':')) + '\n' for row in rows),
              encoding='utf-8',
          )
          print(json.dumps({
              'rows': len(rows),
              'phrases': sum(len(row['phrases']) for row in rows),
              'sha256': hashlib.sha256(out.read_bytes()).hexdigest(),
          }, indent=2))
          PY
      - name: Compile-check frozen evaluator
        run: >-
          python -m py_compile
          scripts/evaluate_gemma_a149.py
          scripts/evaluate_gemma_a593.py
      - name: Replay A593 against frozen diagnostics
        run: >-
          python scripts/evaluate_gemma_a593.py
          --teacher artifacts/gemma-a593-teacher.jsonl
          --output artifacts/gemma-a593-tournament.json
      - name: Freeze result in repository tree
        run: >-
          cp artifacts/gemma-a593-tournament.json
          research/evaluation/v31/compile-time-semantic-tournament-a593.json
      - name: Upload checkpoint corpus and result
        uses: actions/upload-artifact@v4
        with:
          name: gemma-a593-checkpoint
          path: |
            artifacts/gemma-a593-teacher.jsonl
            artifacts/gemma-a593-tournament.json
      - name: Commit frozen result and remove one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/gemma-a593-checkpoint-once.yml
          git add research/evaluation/v31/compile-time-semantic-tournament-a593.json .github/workflows/gemma-a593-checkpoint-once.yml
          git commit -m 'research: freeze A593 tournament checkpoint'
          git push
