name: Validate frozen KV G1+T3 ranks 201-300

on:
  push:
    branches: [main]
    paths:
      - scripts/evaluate_kv_g1_t3_ranks201_300.py
      - research/evaluation/v31/kv-three-lane-fusion-development.json
      - research/enrichment/v31/model-teacher-kv-ranks201-300/**
      - research/benchmark/v31/model-authored-kv-ranks201-300/**
      - .github/workflows/kv-g1-t3-ranks201-300.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate frozen policy and guards
        run: python scripts/evaluate_kv_g1_t3_ranks201_300.py
      - uses: actions/upload-artifact@v4
        with:
          name: kv-g1-t3-ranks201-300-v31
          path: artifacts/kv-g1-t3-ranks201-300-v31.json
          if-no-files-found: error
          retention-days: 30
