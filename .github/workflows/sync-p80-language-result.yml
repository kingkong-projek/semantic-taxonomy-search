name: Sync P80 language result authority

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-p80-language-result.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Patch SSOT and research plan
        run: |
          python - <<'PY'
          from pathlib import Path

          ssot = Path('SSOT.md')
          s = ssot.read_text(encoding='utf-8')
          old = '''Current frozen diversified-language overlap is **41/159 P80 occupations**; this does not authorize generating the same synthetic policy for the remaining 118. Broad synthetic scaling remains paused after the mixed full-universe opened replay. The next decision-bearing loop is fresh independent human/user description evidence sampled primarily from P80 under the existing frozen human-study contract. P90/P95/full-tail optimization is deferred until P80 evidence warrants expansion.\n\nEvidence: `docs/findings/p80-track2-priority-2026-09-09.md` and `research/evaluation/v31/p80-track2-priority-coverage.json`.'''
          new = '''The bounded P80 language expansion is now complete. The same frozen language-diversity policy was attempted for the **118 P80 occupations** previously missing coverage, with no ranker change and all **2,105** active occupations still competing. Source evidence supported generation for 96/118; 22 source-thin identities were left unmanufactured. The full-universe P80 holdout covers **117 concepts / 426 queries** and improves A593 **Top1 53.99% -> 65.02% (+11.03 pp)** and **Hit@5 77.70% -> 83.57% (+5.87 pp)**; demand-weighted Top1 is also **+11.03 pp**.\n\nThe preregistered strict gate is recorded as failed because canonical source-truth Top1 moved `331/333 -> 330/333` with Hit@5 unchanged at `333/333`. Deterministic diagnosis shows only three long `canonical_definition` rows changed: two `rank 1 -> 2`, one `2 -> 1`; **no exact preferred-label case regressed**. Do not retroactively relabel the strict gate as passed, but do advance the P80 challenger to the already-planned **small independent human confirmation**. The deployed YV candidate remains A593 until that human gate clears. P90/P95/full-tail expansion remains deferred.\n\nEvidence: `docs/findings/p80-language-diversity-result-2026-09-09.md`, `research/evaluation/v31/p80-language-diversity-result-v0.json`, and `research/evaluation/v31/p80-language-diversity-canonical-guard-diagnosis-v0.json`.'''
          if old not in s:
              raise SystemExit('SSOT P80 anchor drift')
          ssot.write_text(s.replace(old, new, 1), encoding='utf-8')

          plan = Path('docs/research-plan.md')
          p = plan.read_text(encoding='utf-8')
          oldp = '''**P80-first Track-2 priority amendment (2026-09-09) — P80-FIRST-TRACK2-2026-09-09.** Keep the full 2,105-occupation candidate universe, but make the frozen 159-occupation P80 demand stratum the primary short-feedback-loop population for human recruitment, evaluation and quality work. The existing diversified-language corpus covers 41/159 P80 occupations; that overlap is planning metadata, not permission to mass-generate the remaining 118 with the current synthetic Gemma policy. Broad synthetic scaling remains paused. The next decision-bearing gate is fresh independent human/user descriptions, P80-primary, with valid non-P80 targets preserved and a small long-tail safety view reported separately when available. Expand to P90/P95 only after material P80 evidence warrants it. Evidence: `docs/findings/p80-track2-priority-2026-09-09.md` and `research/evaluation/v31/p80-track2-priority-coverage.json`.'''
          newp = '''**P80-first Track-2 priority amendment (2026-09-09) — P80-FIRST-TRACK2-2026-09-09.** Keep the full 2,105-occupation candidate universe and the frozen 159-occupation P80 demand stratum as the short-feedback-loop priority. The bounded P80 language expansion is complete using the unchanged A-family ranker and the frozen A593 language-diversity policy: 118 previously missing P80 identities were attempted, 96 had source-rich canonical evidence, and source-thin identities were left unmanufactured. On the separately generated full-2,105 competition holdout (117 P80 concepts / 426 queries), A593 -> P80 challenger moves **53.99% -> 65.02% Top1 (+11.03 pp)** and **77.70% -> 83.57% Hit@5 (+5.87 pp)**; demand-weighted Top1 is likewise **+11.03 pp**. The strict canonical no-regression clause formally fails at `331/333 -> 330/333` Top1 while Hit@5 stays `333/333`; diagnosis confines the change to three long canonical-definition rows (two `1->2`, one `2->1`) with no exact-label regression. **Do not promote yet and do not add architecture. Next gate: small independent human P80-primary confirmation against the frozen A593 control and P80 challenger.** P90/P95/full-tail expansion remains deferred. Evidence: `docs/findings/p80-language-diversity-result-2026-09-09.md` and `research/evaluation/v31/p80-language-diversity-result-v0.json`.'''
          if oldp not in p:
              raise SystemExit('research-plan P80 anchor drift')
          plan.write_text(p.replace(oldp, newp, 1), encoding='utf-8')
          PY
      - name: Commit authority sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SSOT.md docs/research-plan.md
          git commit -m 'docs: advance P80 challenger to human confirmation'
          git push
