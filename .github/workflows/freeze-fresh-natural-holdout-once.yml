name: Freeze fresh natural holdout once

on:
  push:
    branches: [main]
    paths:
      - scripts/build_fresh_natural_holdout_adjudication.py
      - .github/workflows/freeze-fresh-natural-holdout-once.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  freeze:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkout pinned Yrkesväljaren generator evidence
        run: |
          set -euo pipefail
          rm -rf /tmp/yv-generator
          git init -q /tmp/yv-generator
          git -C /tmp/yv-generator remote add origin https://gitlab.com/arbetsformedlingen/taxonomy-dev/backend/yrkesvaljaren.git
          git -C /tmp/yv-generator fetch -q --depth 1 origin 6dd9e4737d7db3cb2709f8082808b88e5c89ed6e
          git -C /tmp/yv-generator checkout -q --detach FETCH_HEAD
          printf '%s\n' 6dd9e4737d7db3cb2709f8082808b88e5c89ed6e > /tmp/yv-generator/SOURCE_COMMIT.txt
      - name: Rebuild blinded ranks 51-80
        run: |
          python scripts/build_yv_real_query_review_packet.py --version 31 --limit 100 --source-dir /tmp/yv-generator --output-dir /tmp/yv-review-100
          mkdir -p /tmp/fresh-holdout
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('/tmp/yv-review-100/review-packet.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()][50:80]
          assert [r['observed_rank_within_unbound_population'] for r in rows]==list(range(51,81))
          clean=[]
          for r in rows:
              clean.append({'source_pool':'observed_unbound_query','source_id':r['id'],'query':r['query'],'observed_count':r['observed_count'],'observed_rank_within_unbound_population':r['observed_rank_within_unbound_population'],'source':r['source']})
          Path('/tmp/fresh-holdout/batch.jsonl').write_text(''.join(json.dumps(r,ensure_ascii=False,sort_keys=True)+'\n' for r in clean),encoding='utf-8')
          assert all('candidate_context' not in r and 'top5' not in r for r in clean)
          PY
          python scripts/build_adjudication_context.py --batch /tmp/fresh-holdout/batch.jsonl --output /tmp/fresh-holdout/context.json
      - name: Build and validate frozen benchmark
        run: |
          rm -rf /tmp/fresh-adjudicated
          python scripts/build_fresh_natural_holdout_adjudication.py --batch /tmp/fresh-holdout/batch.jsonl --context /tmp/fresh-holdout/context.json --output-dir /tmp/fresh-adjudicated
          python scripts/validate_benchmark.py /tmp/fresh-adjudicated/benchmark.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('/tmp/fresh-adjudicated/manifest.json').read_text())
          assert m['cases']==30 and m['observed_volume']==138075677
          assert m['intent_counts']=={'AMBIGUOUS':4,'NO_MATCH':25,'SINGLE':1}
          assert m['status']=='MODEL_ADJUDICATED_BLINDED_TO_C2'
          print(json.dumps(m,indent=2,sort_keys=True))
          PY
      - name: Freeze benchmark
        run: |
          mkdir -p research/benchmark/v31/fresh-natural-holdout
          cp /tmp/fresh-adjudicated/benchmark.jsonl research/benchmark/v31/fresh-natural-holdout/benchmark.jsonl
          cp /tmp/fresh-adjudicated/manifest.json research/benchmark/v31/fresh-natural-holdout/manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/benchmark/v31/fresh-natural-holdout
          if git diff --cached --quiet; then echo 'already frozen'; exit 0; fi
          git commit -m 'research: freeze blinded fresh natural-query holdout'
          git push origin HEAD:main
