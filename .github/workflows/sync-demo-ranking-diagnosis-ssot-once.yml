name: Sync demo ranking diagnosis SSOT once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-demo-ranking-diagnosis-ssot-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch living research plan
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/research-plan.md')
          text = p.read_text(encoding='utf-8')
          start_marker = '**Exploratory legacy demo evidence (2026-09-07):'
          end_marker = '\n\n**Human-gate status (2026-09-07):'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('legacy demo evidence marker not found; refusing broad edit')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('human-gate marker not found; refusing broad edit')
          new = """**Exploratory dual-stream demo failure evidence (2026-09-07): the stop condition has now been met for bounded description-ranking/calibration work in both streams.** One explicitly exported legacy tester session contained 21 submissions / 19 unique descriptions. The first demo mechanically stamped every row `skill`, but the tester later confirmed that some inputs were intended for YV and some for KV; intended stream therefore remains unknown per legacy row and the session MUST NOT be reported as 19 KV cases. Cross-stream replay against the exact deployed assets reproduced two material mechanisms: common Swedish function words can win BM25 lanes by themselves, and KV's fixed `C0 rank1 -> G1 slot -> teacher slots` fusion can place such weak lexical winners ahead of stronger teacher evidence. The YV replay additionally exposed a coverage/calibration boundary: arbitrary descriptions can rank only the 165 P80+boundary occupation identities even though the exact router carries many more occupation parents, so out-of-envelope descriptions require conservative abstention rather than nearest-neighbour-looking lists. A query-only high-confidence function-word probe left all 20 AF second-holdout target ranks unchanged, but on 173 already-opened development query/target pairs it improved 14 ranks, worsened 4 and changed Hit@5 162 -> 161 while MRR rose 0.317 -> 0.347; this is diagnostic evidence only and is NOT promoted. The next decision-bearing comparison must use newly frozen, stream-separated descriptions and rank-sensitive list-quality metrics before any retrieval change is accepted. Evidence: `docs/findings/kv-demo-exploratory-field-failures-2026-09-07.md`.

**Description-ranking metric contract (2026-09-07): Hit@5 is secondary historical recall, not the product-quality headline.** For occupation and skill separately, decision-bearing human/opened evaluation must report at least Top1 acceptable, first acceptable rank / MRR, nDCG@5 where multiple targets are acceptable, unacceptable-prefix burden, candidate-list precision, number of unacceptable returned candidates, and correct abstention on clarification-needed/unmappable/out-of-scope cases. A rank-3 acceptable result preceded by two unacceptable results is therefore explicitly poor even though `Hit@5=yes`. `scripts/score_human_description_study.py` encodes this contract for the frozen human-study chain."""
          p.write_text(text[:start] + new + text[end:], encoding='utf-8')
          PY
      - name: Commit SSOT update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research-plan.md
          git diff --cached --exit-code && exit 0
          git commit -m 'docs: sync rank-sensitive cross-stream demo diagnosis'
          git push
