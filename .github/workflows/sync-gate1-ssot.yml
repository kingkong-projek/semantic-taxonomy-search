name: Sync Gate 1 SSOT

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-gate1-ssot.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synchronize living research plan
        run: python scripts/sync_gate1_ssot.py
      - name: Verify and commit synchronized state
        run: |
          grep -F "**Gate 1 is closed.**" docs/research-plan.md
          grep -F "### Now — Gate 2" docs/research-plan.md
          grep -F "benchmark schema and semantic validator contract" docs/research-plan.md
          grep -F "deprecated historical vocabulary is measured separately" scripts/unified_target_coverage.py
          git config user.name "semantic-taxonomy-search-ci"
          git config user.email "semantic-taxonomy-search-ci@users.noreply.github.com"
          git add docs/research-plan.md scripts/unified_target_coverage.py
          git diff --cached --check
          git commit -m "docs: close Gate 1 and advance SSOT to benchmark"
          git push origin HEAD:main
