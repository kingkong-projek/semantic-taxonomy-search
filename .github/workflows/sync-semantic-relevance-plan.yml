name: Sync semantic relevance research-plan amendment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-semantic-relevance-plan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Insert current superseding amendment
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/research-plan.md')
          text=p.read_text(encoding='utf-8')
          marker='<!-- SEMANTIC-DISPLAY-RELEVANCE-2026-09-09 -->'
          if marker in text:
              print('amendment already present')
              raise SystemExit(0)
          title='# Semantic Taxonomy Search — living research plan\n'
          if not text.startswith(title):
              raise SystemExit('unexpected research-plan title')
          amendment='''\n**Semantic display relevance amendment (2026-09-09) — ACTIVE PRIMARY RESIDUAL.**\n\n<!-- SEMANTIC-DISPLAY-RELEVANCE-2026-09-09 -->\n\nOccupation retrieval remains on the simple A-family boundary and is **not** being reopened: privileged exact/canonical lexical routing plus one teacher-expanded sparse/BM25 description ranker over all 2,105 active occupation-name identities. P80 remains a 159-occupation demand-priority stratum; the P80-enriched candidate is research-only pending independent human/user confirmation.\n\nThe primary active residual is now **Top-5 display precision**. Correct targets often sit at ranks 2–5, so fixed Top-N truncation is invalid. Multiple prefrozen display mechanisms have been falsified on user-style transfer: merged BM25 thresholds, coverage/phrase gates, local lexical contrast, SSYK+phrase heuristics, coherent-unit lexical similarity, and a tiny linear classifier over those lexical/SSYK-derived features. The linear classifier is the decisive falsifier: untouched 2024 natural-task proxy retained 167/167 Hit@5 and 87/87 rank-2–5 targets while reducing safe negatives 48.46%, but exact frozen opened replay fell 28->24 Hit@5 and 13->9 lower-rank hits while obvious junk remained. Do not retune these families from opened rows.\n\nThis evidence now clears the complexity bar for **one bounded candidate-level semantic-sufficiency experiment**, without promoting a second production ranker. Retrieval/order remain frozen. Research-only Gemma judges each already-retrieved Top-5 candidate as `keep`, `uncertain`, or `drop` from source-bound candidate evidence; it sees no rank, target or SSYK and candidate order is deterministically shuffled. Rank 1 remains visible; ranks 2–5 are removed only on a confident `drop`. Opened 17/88 is not available to prompt/model/rule selection.\n\nPrimary v0 evidence is natural historical 2024 Platsbanken task text with the structured occupation as target and different-SSYK4 non-targets as conservative safe negatives; the 22 source-thin rescue target identities are excluded from this primary proxy to avoid source-overlap ambiguity. Prefrozen strong gate: overall baseline-Hit@5 target retention >=99%, rank-2–5 retention >=98%, and >=60% safe cross-SSYK tail-negative reduction. Promising gate: >=98%, >=98%, >=50%. Only a pass permits exact unchanged opened replay.\n\nIf semantic-oracle v0 transfers to opened user-style stress under its prefrozen acceptance checks, the next research step is **distillation/compilation into a small deterministic runtime-compatible student**. Runtime LLM/provider API remains out of scope. If the semantic oracle itself fails, do not build a student or another heuristic stack; reassess candidate evidence and product interaction. Fresh human/domain-expert relevance judgments remain decisive when available.\n\nThis amendment supersedes older lower sections that say a second semantic stage is categorically disallowed. The correct current rule is narrower: **no second production semantic stage without evidence; one bounded candidate-level semantic sufficiency experiment is now explicitly authorized by the reproduced display-precision residual.**\n\nEvidence and current execution state: `SSOT.md`, `research/evaluation/v31/p80-display-linear-relevance-v0.json`, and `research/evaluation/v31/p80-display-linear-relevance-opened-replay-v0.json`.\n\n'''
          p.write_text(title + amendment + text[len(title):], encoding='utf-8')
          PY
      - name: Commit synced plan
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research-plan.md
          git commit -m 'docs: authorize bounded semantic display relevance experiment'
          git pull --rebase origin main
          git push
