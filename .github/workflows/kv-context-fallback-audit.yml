name: KV context fallback audit

on:
  push:
    branches: [main]
    paths:
      - scripts/audit_kv_context_fallback.py
      - .github/workflows/kv-context-fallback-audit.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/audit_kv_context_fallback.py --output artifacts/kv-context-fallback-audit-v31.json
      - uses: actions/upload-artifact@v4
        with:
          name: kv-context-fallback-audit-v31
          path: artifacts/kv-context-fallback-audit-v31.json
          if-no-files-found: error
          retention-days: 30
