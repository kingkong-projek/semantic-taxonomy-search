name: Freeze current selector failure audit once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/freeze-current-selector-failure-audit-once.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  freeze:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout pinned YV generator
        env:
          SOURCE_COMMIT: 6dd9e4737d7db3cb2709f8082808b88e5c89ed6e
        run: |
          rm -rf /tmp/yv-generator
          git init -q /tmp/yv-generator
          git -C /tmp/yv-generator remote add origin https://gitlab.com/arbetsformedlingen/taxonomy-dev/backend/yrkesvaljaren.git
          git -C /tmp/yv-generator fetch -q --depth 1 origin "$SOURCE_COMMIT"
          git -C /tmp/yv-generator checkout -q --detach FETCH_HEAD
          printf '%s\n' "$SOURCE_COMMIT" > /tmp/yv-generator/SOURCE_COMMIT.txt

      - name: Checkout pinned selector frontend
        env:
          SOURCE_COMMIT: 0eba98e3a91079a43c1eaf6da09dfabe11e5bc8b
        run: |
          rm -rf /tmp/yv-frontend
          git init -q /tmp/yv-frontend
          git -C /tmp/yv-frontend remote add origin https://gitlab.com/arbetsformedlingen/taxonomy-dev/frontend/yrkesvaljaren.git
          git -C /tmp/yv-frontend fetch -q --depth 1 origin "$SOURCE_COMMIT"
          git -C /tmp/yv-frontend checkout -q --detach FETCH_HEAD
          printf '%s\n' "$SOURCE_COMMIT" > /tmp/yv-frontend/SOURCE_COMMIT.txt

      - name: Reproduce product-first audit
        run: |
          rm -rf /tmp/current-selector-audit
          python scripts/audit_current_selector_failure_modes.py \
            --version 31 \
            --generator-dir /tmp/yv-generator \
            --frontend-dir /tmp/yv-frontend \
            --output-dir /tmp/current-selector-audit
          mkdir -p research/coverage/v31 docs/findings
          cp /tmp/current-selector-audit/aggregate.json research/coverage/v31/current-selector-failure-audit.json

      - name: Write finding and sync SSOT
        run: |
          cat > docs/findings/current-selector-failure-audit-v31.md <<'EOF'
          # Current YV/KV product failure-mode audit — taxonomy v31

          **Status:** measured / code-audited  
          **Pinned YV generator:** `6dd9e4737d7db3cb2709f8082808b88e5c89ed6e`  
          **Pinned YV/KV frontend:** `0eba98e3a91079a43c1eaf6da09dfabe11e5bc8b`

          ## Why this audit exists

          Real users report that they sometimes cannot find the occupation or competence they need in YV/KV. Before adding semantic complexity, the first question must therefore be which failure modes already exist in the ordinary selectors and which of them can be fixed with data/logic the products already own.

          This audit corrects an earlier over-broad interpretation of YV's excluded-title and multi-context populations. It evaluates the published v31 data, pinned generator, pinned frontend source and observed YV query-frequency corpus together.

          ## YV: multi-context job titles are not broken in ordinary dropdown search

          Published YV contains **541 job-title IDs in multiple occupation-name contexts**, represented by **1,186 selectable context rows**. For an exact preferred-label query, the current deterministic direct lane exposes **all intended contexts within top 10 for 541/541 titles**. The measured exact-query population is **35,949,704 searches**, and all of that volume belongs to cases whose ordinary dropdown contains every intended context.

          Therefore the parenthesis/disambiguation model itself is not the primary YV retrieval defect. The ordinary path works when the user types the exact title and explicitly chooses a displayed context row.

          ## YV: context can still collapse outside the explicit dropdown choice

          The frontend has three separate context-preservation hazards:

          1. `findExactMatch()` is used on blur/free-text confirmation and resolves with `taxonomyData.find(...)`. It accepts either the full display label or the bare preferred label. For a bare exact label shared by multiple context rows, this chooses the first row without an explicit context choice. The **541 multi-context IDs / 35.95M exact-query volume** are an *exposed population*, not a measured failure count because no event log tells us how often users blur/tab instead of clicking a row.
          2. Programmatic `setSelection()` validates rich job-title input but then resolves taxonomy data by job-title ID only. Of the 1,186 multi-context rows, **645 are non-first contextual rows** that can collapse to another parent on such a roundtrip.
          3. Standard form serialization writes only the job-title ID. It therefore cannot encode the chosen occupation parent for any of the **1,186 multi-context rows**. Multi-select duplicate handling also compares job-title ID first, so two contexts of the same title cannot coexist.

          These are product identity/interaction issues, not reasons to add embeddings.

          ## YV: 11.153% excluded-title query volume is not an 11% product failure rate

          Generator policy excludes 205 active job titles: 104 with more than three mapped occupation parents and 101 redundant-label titles. The observed corpus contains **349,760,282 exact searches** for 141 of those labels, or **11.153%** of all retained query volume.

          Replaying the current deterministic direct YV lane changes the interpretation materially:

          - relevant mapped occupation in direct top 10 for **100/101 redundant-label titles**;
          - relevant mapped occupation in direct top 10 for **8/104 too-many-parent titles**;
          - because those eight include very high-volume broad labels, **336,025,601 / 349,760,282 = 96.073%** of excluded-title exact-query volume already has at least one mapped occupation in direct top 10;
          - only **13,734,681 = 3.927%** of excluded-title volume lacks such a deterministic direct route;
          - that unresolved direct-lane volume is **0.438% of all retained query volume**.

          This is a direct-lane measurement only. Guarded Fuse fallback may rescue additional cases, so 0.438% is not a final product failure rate either.

          Highest-volume unresolved examples include `Lastbilsförare` (2,475,234), `Lagermedarbetare` (2,148,491), `Grundskollärare` (1,628,450), `Lastbilschaufför` (1,376,452), `Beteendevetare` (1,376,342), `Idrottslärare` (952,555) and `Slöjdlärare` (787,437).

          ## Existing canonical vocabulary is underused

          Both current products generate candidates primarily from preferred labels.

          YV:

          - **197** admitted concepts expose canonical alternative-label vocabulary;
          - **362** distinct alternative-label surfaces;
          - **51** of those surfaces produce no deterministic direct YV result.

          KV:

          - **819** skills expose alternative labels;
          - **1,308** distinct alternative-label surfaces;
          - **260** have no canonical contains-match in the current direct label lane;
          - **1,654** skills have a canonical definition distinct from the preferred label;
          - current KV candidate generation indexes preferred labels/tokens only. Occupation/SSYK context can rank/filter already generated lexical candidates but cannot add missing query vocabulary.

          This is the first cheap retrieval surface to evaluate before manufacturing new semantic text.

          ## YV → KV hand-off has a demonstrated integration footgun

          KV accepts `occupation-name` or `ssyk-level-4` IDs as context. A YV `job-title` selection exposes its occupation parent as `selection.related.id`.

          The repository's own stepped YV→KV demo instead passes `selection.id` directly to `af-occupation-id`. For a job-title row this is the job-title ID, which KV does not recognise as context, so it falls back to context-free/global behaviour.

          This proves the API is easy to integrate incorrectly and the repo demo currently does so for job-title selections. It does **not** prove production consumers make the same mistake; production integration must be inspected separately.

          ## Product-first decision

          Before any further semantic-source expansion, embeddings or synthetic-query-driven model tuning:

          1. protect explicit YV context identity across blur/autoselect, programmatic roundtrip and form output where applicable;
          2. verify/fix YV→KV occupation-context hand-off with an actual job-title integration test;
          3. measure the demand and gain from already-canonical alternative labels in YV/KV;
          4. evaluate the remaining high-volume excluded-title direct-route misses with the exact current fuzzy selector before adding a new router;
          5. replay real user-reported failures when available and classify them against these failure modes;
          6. only then continue description-semantic fallback experiments for cases the ordinary selector still cannot discover.

          The separate description fallback remains valuable: current KV still fails genuine long descriptive skill queries in the frozen benchmark. This audit changes **experiment order**, not the long-term fallback use case.

          ## Reproduction

          Frozen aggregate: `research/coverage/v31/current-selector-failure-audit.json`  
          Reproducer: `scripts/audit_current_selector_failure_modes.py`  
          Workflow: `.github/workflows/current-selector-failure-audit.yml`
          EOF

          python - <<'PY'
          from pathlib import Path

          path = Path('docs/research-plan.md')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'expected exactly one SSOT anchor, got {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          anchor = "Evidence: `docs/findings/current-selector-baseline-2026-09-06.md`.\n\n### 2.2 Pareto / simple-first delivery principle"
          replacement = """Evidence: `docs/findings/current-selector-baseline-2026-09-06.md`.

          **Product-first gate before semantic expansion:** the ordinary YV/KV products must be audited against their actual published data, interaction paths and integration contracts before a residual is attributed to missing semantic intelligence. Prefer fixing existing reachability, context preservation, canonical vocabulary and hand-off defects before adding retrieval sources/models. Synthetic or description-style probes diagnose only the residual that remains after this baseline is honest.

          Evidence: `docs/findings/current-selector-failure-audit-v31.md` and `research/coverage/v31/current-selector-failure-audit.json`.

          ### 2.2 Pareto / simple-first delivery principle"""
          replace_once(anchor, replacement)

          anchor = "YV weights are behavioural/search-frequency priors, not concept meaning.\n\nEvidence: `docs/findings/selector-coverage-v31.md`."
          replacement = """YV weights are behavioural/search-frequency priors, not concept meaning.

          Product replay correction: the multi-context read model itself works on ordinary exact dropdown lookup. Exact preferred-label search exposes **all intended occupation contexts in top 10 for 541/541 multi-parent job-title IDs** (1,186 rows; 35.95M observed exact-query volume). The measured hazards are instead context collapse in blur/programmatic/form paths, not failure to display the alternative parentheses in the normal explicit-choice path.

          Evidence: `docs/findings/selector-coverage-v31.md` and `docs/findings/current-selector-failure-audit-v31.md`."""
          replace_once(anchor, replacement)

          anchor = "Thus **141 observed excluded-title labels account for 349,760,282 searches = 11.153% of all volume**.\n\nThis is not an edge case. High-volume examples include `undersköterska`, `butikssäljare`, `sjuksköterska`, `kock`, `projektledare` and `säljare`."
          replacement = """Thus **141 observed excluded-title labels account for 349,760,282 searches = 11.153% of all volume**.

          **Important product-replay correction:** 11.153% is a vocabulary/admission statistic, not a product failure rate. The current deterministic direct YV lane already puts at least one generator-mapped occupation in top 10 for **336,025,601 / 349,760,282 = 96.073%** of that excluded-title exact-query volume. Only **13,734,681 = 3.927%** of excluded-title volume — **0.438% of all retained query volume** — lacks such a direct route before guarded Fuse fallback is considered. High-volume unresolved direct-lane examples include `Lastbilsförare`, `Lagermedarbetare`, `Grundskollärare`, `Lastbilschaufför`, `Beteendevetare`, `Idrottslärare` and `Slöjdlärare`.

          Therefore excluded-title work should target the measured residual, not all 205 titles or all 11.153% raw volume."""
          replace_once(anchor, replacement)

          anchor = "### 5.6 Published Kompetensväljaren v31"
          insert = """### 5.5.2 Current YV/KV product failure-mode audit

          The pinned current selectors have now been audited as products, not only as data sources.

          YV findings:

          - ordinary exact dropdown search is healthy for multi-context titles: **541/541** expose all intended context rows within top 10;
          - blur/free-text exact-match confirmation uses first-row `find(...)`, creating a context-autoselect risk for those 541 titles; **35.95M** observed exact-query volume is the exposed population, not a measured failure count;
          - rich programmatic `setSelection()` resolves by job-title ID only, so **645 non-first context rows** can collapse on roundtrip;
          - standard HTML form value serializes only job-title ID and therefore cannot preserve the chosen parent for any of the **1,186** multi-context rows;
          - YV indexes preferred labels only; 197 admitted concepts expose 362 canonical alternative-label surfaces, of which **51** have no current deterministic direct result.

          KV findings:

          - all 6,752 active skills are present, but candidate generation uses preferred labels/tokens only;
          - **819** skills expose 1,308 canonical alternative-label surfaces, with **260** lacking a canonical contains match in the current direct lane;
          - **1,654** skills have a definition distinct from preferred label, but definitions do not participate in current candidate generation;
          - occupation/SSYK context ranks or filters already generated lexical candidates; it cannot manufacture a candidate when the user's wording is absent from the skill label.

          Integration finding:

          - YV job-title output carries the occupation parent as `related.id`, while KV accepts occupation-name/SSYK4 context;
          - the repo's stepped YV→KV demo passes `selection.id` instead, which is wrong for job-title selections and produces context-free KV behaviour;
          - this is a demonstrated integration footgun, not yet evidence about production consumers.

          **Decision:** pause semantic-source/model expansion until these ordinary-product residuals are measured/fixed first. Description fallback remains a separate incremental capability for queries that still fail after the baseline is corrected.

          Evidence: `docs/findings/current-selector-failure-audit-v31.md` and `research/coverage/v31/current-selector-failure-audit.json`.

          ### 5.6 Published Kompetensväljaren v31"""
          replace_once(anchor, insert)

          anchor = "- [x] pin and code-audit the **current YV/KV selector implementation as baseline 0** (`kingkong-projek/yrkesvaljaren@0eba98e3a91079a43c1eaf6da09dfabe11e5bc8b`); separate primary fallback-value evaluation from secondary full-replacement potential"
          replacement = anchor + """
          - [x] run a **product-first current-selector failure-mode audit** over pinned frontend + YV generator + published v31 data; correct the earlier over-broad excluded-title interpretation and verify the normal 541-title multi-context dropdown path
          - [ ] before further semantic expansion, close/measure the ordinary-product residuals: YV exact-blur disambiguation, context-preserving roundtrip/form semantics where required, YV→KV job-title hand-off, unused canonical alternative labels, and exact current-Fuse reachability for the remaining excluded-title residual"""
          replace_once(anchor, replacement)

          anchor = "### Then — Gate 3\n\nFirst decision: run the **smallest useful baseline** on the compact Pareto benchmark before adding more data engineering."
          replacement = """### Then — Gate 3

          **Current ordering correction:** further Gate-3 semantic expansion is paused until the product-first YV/KV residual checklist in Gate 2 is closed or explicitly measured as non-material. Existing C0/C1/C2/F1 results remain valid research evidence, but they do not outrank cheap fixes to the current selector paths.

          First decision: run the **smallest useful baseline** on the compact Pareto benchmark before adding more data engineering."""
          replace_once(anchor, replacement)

          anchor = "10. Excluded-title search importance? **349.76M searches = 11.153% of measured query volume**."
          replacement = "10. Excluded-title search importance? **349.76M searches = 11.153% of measured vocabulary volume, but current direct YV already routes 336.03M = 96.073% of that volume to at least one mapped occupation in top 10. The direct-lane residual is 13.73M = 0.438% of all retained query volume before Fuse; do not treat 11.153% as a failure rate.**"
          replace_once(anchor, replacement)

          anchor = "36. What is the smallest evidence/retrieval configuration whose Pareto performance is statistically/materially indistinguishable from more complex alternatives?"
          replacement = anchor + """
          37. How often do users hit YV's exact-label blur/autoselect path instead of explicitly choosing a multi-context row, and what is the real error rate by context?
          38. Do production YV→KV consumers pass the job-title's `related.id` (occupation-name) correctly, or repeat the repo demo's `selection.id` integration footgun?
          39. How much real demand and Discovery@5 gain comes from the canonical alternative-label vocabulary that current YV/KV runtime does not index?"""
          replace_once(anchor, replacement)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate frozen result and SSOT
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('research/coverage/v31/current-selector-failure-audit.json').read_text(encoding='utf-8'))
          assert x['YV']['multi_parent_title_behavior']['all_contexts_present_in_direct_top10_for_exact_title_query'] == 541
          by=x['YV']['excluded_title_direct_reachability']['by_reason']
          assert sum(v['volume_without_direct_relevant_top10'] for v in by.values()) == 13734681
          plan=Path('docs/research-plan.md').read_text(encoding='utf-8')
          for token in ['96.073%', '0.438%', '645 non-first context rows', 'product-first current-selector failure-mode audit', 'further Gate-3 semantic expansion is paused']:
              assert token in plan, token
          print('frozen current-selector failure audit + SSOT validated')
          PY

      - name: Commit frozen audit
        run: |
          git config user.name "semantic-taxonomy-search-bot"
          git config user.email "semantic-taxonomy-search-bot@users.noreply.github.com"
          git add research/coverage/v31/current-selector-failure-audit.json docs/findings/current-selector-failure-audit-v31.md docs/research-plan.md
          git diff --cached --check
          git commit -m "research: freeze current selector failure audit"
          git push origin HEAD:main
