name: Track 1 corrected persona vocabulary boundary once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/track1-persona-vocabulary-boundary-rerun-once.yml

permissions:
  contents: write

jobs:
  classify:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Classify corrected lexical boundary
        run: |
          rm -f artifacts/track1-persona-vocabulary-boundary-v31.json
          python3 scripts/classify_track1_persona_terms.py --version 31 --output artifacts/track1-persona-vocabulary-boundary-v31.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('artifacts/track1-persona-vocabulary-boundary-v31.json').read_text())
          assert x['schema_version']==2
          assert len(x['cases'])==7
          by_id={c['id']:c for c in x['cases']}
          assert by_id['control.ykb']['boundary_class']=='TRACK1_LEXICAL_COMPOSITION_CANDIDATE'
          print(json.dumps([{k:c[k] for k in ('id','query','boundary_class')} | {
            'exact':len(c['exact_authoritative_surfaces']),
            'query_contains':len(c['query_contains_authoritative_surfaces']),
            'surface_contains_query':len(c['authoritative_surfaces_containing_query'])
          } for c in x['cases']],ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: track1-persona-vocabulary-boundary-v31-corrected
          path: artifacts/track1-persona-vocabulary-boundary-v31.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove one-off workflow
        run: |
          git rm .github/workflows/track1-persona-vocabulary-boundary-rerun-once.yml
          git config user.name semantic-taxonomy-search-bot
          git config user.email semantic-taxonomy-search-bot@users.noreply.github.com
          git commit -m 'chore: clean corrected persona boundary workflow'
          git pull --rebase origin main
          git push origin HEAD:main
