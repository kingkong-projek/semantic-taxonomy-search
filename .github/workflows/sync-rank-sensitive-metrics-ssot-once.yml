name: Sync rank-sensitive fallback metrics SSOT once

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch research SSOT
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/research-plan.md')
          text = p.read_text(encoding='utf-8')
          old = '''**Exploratory demo failure evidence (2026-09-07): the stop condition has now been met for a bounded KV ranking/calibration investigation.** One explicitly exported tester session contained 21 submissions / 19 unique descriptions and exposed several trust-breaking rank orders, including plausible task descriptions where a related candidate appeared below obviously unrelated top results. This session is opened, non-preregistered product evidence and MUST NOT be reported as blind human accuracy or used as a tuning holdout. It does falsify the assumption that Hit@5 alone is sufficient for product quality: a rank-3 hit can coexist with unusable rank 1–2 results. Simple matched-term coverage is also insufficient as a confidence gate because some visibly bad rankings matched all unique query terms. The next bounded retrieval work is therefore diagnostics plus conservative ranking/abstention gating, evaluated on a newly frozen independent description set; do not tune directly to the 19 opened descriptions and do not escalate model class without that evidence. Evidence: `docs/findings/kv-demo-exploratory-field-failures-2026-09-07.md`.'''
          new = '''**Exploratory legacy demo evidence (2026-09-07): Hit@5 is demoted to a secondary recall-style signal for product quality.** One explicitly exported tester session contained 21 submissions / 19 unique descriptions. The first demo exposed only KV, so every row was mechanically stamped `stream: skill`; the tester later confirmed that some inputs were intended as occupation descriptions and others as competence descriptions. Individual legacy rows therefore have unknown intended stream and MUST NOT be reported as 19 KV cases or reconstructed post-hoc as ground truth. The opened session nevertheless exposed trust-breaking rank orders where a plausible candidate could sit below obviously unrelated results, falsifying the assumption that Hit@5 alone is sufficient for product quality. A separate diagnostic cross-stream probe indicates both KV rank pollution and materially under-tested YV full task-description behaviour; it is not an accuracy evaluation. Future human/opened reporting is separate by stream and must include Top1, first acceptable rank/MRR, nDCG@5, unacceptable-prefix burden, candidate-list precision, returned-junk burden, abstention and participant recognition/selection. The next bounded retrieval work is diagnostics plus conservative ranking/abstention gating evaluated on newly frozen independent occupation and skill descriptions; do not tune directly to the 19 opened descriptions and do not escalate model class without that evidence. Evidence: `docs/findings/kv-demo-exploratory-field-failures-2026-09-07.md` and `scripts/score_human_description_study.py`.'''
          if old not in text:
              raise SystemExit('expected exploratory paragraph not found; refusing broad edit')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit SSOT update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/research-plan.md
          git diff --cached --check
          git commit -m 'docs: make rank-sensitive quality primary'
          git push origin HEAD:main
