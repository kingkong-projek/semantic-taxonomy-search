name: Sync skill fallback increment into SSOT

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-skill-fallback-increment-ssot-once.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch SSOT
        run: python3 scripts/sync_skill_fallback_increment_ssot_once.py
      - name: Validate
        run: |
          grep -Fq '+31.429 percentage points Discovery@5' docs/research-plan.md
          grep -Fq '0.000% Discovery@5' docs/research-plan.md
          grep -Fq 'Non-blocking YV follow-ups' docs/research-plan.md
          grep -Fq '11/35 = 31.429%' docs/research-plan.md
          git diff --check
      - name: Commit
        run: |
          git config user.name semantic-taxonomy-search-bot
          git config user.email semantic-taxonomy-search-bot@users.noreply.github.com
          git add docs/research-plan.md
          git commit -m 'research: establish measured KV fallback increment'
          git push origin HEAD:main
