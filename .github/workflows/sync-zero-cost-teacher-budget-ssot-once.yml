name: Sync zero-cost teacher budget into SSOT once

on:
  push:
    branches: [main]
    paths:
      - scripts/sync_zero_cost_teacher_budget_ssot_once.py
      - .github/workflows/sync-zero-cost-teacher-budget-ssot-once.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply SSOT patch
        run: python scripts/sync_zero_cost_teacher_budget_ssot_once.py
      - name: Commit SSOT if changed
        run: |
          if git diff --quiet -- docs/research-plan.md; then
            echo "No SSOT change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research-plan.md
          git commit -m "research: set zero-cost teacher budget"
          git push origin HEAD:main
