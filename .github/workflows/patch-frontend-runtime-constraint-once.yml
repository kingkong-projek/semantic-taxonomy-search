name: Patch frontend runtime constraint once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-frontend-runtime-constraint-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Patch SSOT deployment constraint
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('docs/research-plan.md')
          s = p.read_text(encoding='utf-8')
          old = '''Current deployment principle:

> **Compile semantics when practical; serve semantics where central iteration materially improves the product.**

Local/static versus API remains a deployment experiment, not a relevance-architecture decision.
'''
          new = '''Current deployment constraint:

> **Frontend-only at runtime: compile as much semantic work as practical at build time, keep ordinary YV/KV free of semantic payload/runtime cost, and lazy-load only the smallest static semantic assets needed after the user explicitly enters description fallback.**

The current product architecture has no semantic search/inference API. Relevance experiments must therefore remain deployable as static frontend assets and deterministic browser computation. Runtime design is low-end-mobile-first: no heavyweight model or accelerator requirement, no WebGPU dependency, and no semantic asset on the ordinary-selector critical path.

Semantic assets must be chunkable. Prefer a tiny bootstrap/router or compact inverted index first; load deeper/sharded evidence only when the first fallback stage cannot produce a sufficiently good small candidate set. Build-time work may be arbitrarily richer than runtime work, including offline generation, adjudication, graph compilation, weighting, pruning and index construction, provided provenance is preserved and generated evidence is never promoted to canonical truth merely because it was generated.

The preferred runtime shape is therefore progressive:

```text
ordinary YV/KV
  -> 0 semantic bytes/runtime work
user opens Beskriv ditt yrke / Beskriv din kompetens
  -> load smallest semantic bootstrap/index
  -> cheap token lookup / precomputed scoring over candidate postings
  -> if needed, lazy-load one or more relevant semantic shards
  -> return product-valid canonical candidates or abstain
```

API serving is out of scope under the current product constraint. A future architecture change may revisit that boundary, but it is not a variable in the present v0 research.
'''
          if old not in s:
              raise SystemExit('deployment principle anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research-plan.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: lock frontend-only lazy semantic runtime"
          git push
