name: Freeze compact YV safety SSOT

on:
  push:
    branches: [main]
    paths:
      - scripts/freeze_compact_yv_safety_ssot.py
      - .github/workflows/freeze-compact-yv-safety-ssot.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  freeze:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkout pinned Yrkesväljaren generator evidence
        env:
          YV_GENERATOR_COMMIT: 6dd9e4737d7db3cb2709f8082808b88e5c89ed6e
        run: |
          rm -rf /tmp/yv-generator
          git init -q /tmp/yv-generator
          git -C /tmp/yv-generator remote add origin https://gitlab.com/arbetsformedlingen/taxonomy-dev/backend/yrkesvaljaren.git
          git -C /tmp/yv-generator fetch -q --depth 1 origin "$YV_GENERATOR_COMMIT"
          git -C /tmp/yv-generator checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/yv-generator rev-parse HEAD)" = "$YV_GENERATOR_COMMIT"
          printf '%s\n' "$YV_GENERATOR_COMMIT" > /tmp/yv-generator/SOURCE_COMMIT.txt
      - name: Rebuild compact safety slices
        run: |
          python scripts/build_compact_yv_profile_safety.py \
            --version 31 \
            --source-dir /tmp/yv-generator \
            --multi-parent-limit 20 \
            --excluded-limit 20 \
            --output-dir /tmp/compact-yv-profile-safety-v31
          python scripts/validate_benchmark.py /tmp/compact-yv-profile-safety-v31/multi-parent-auto.jsonl
      - name: Freeze benchmark and synchronize SSOT
        run: python scripts/freeze_compact_yv_safety_ssot.py /tmp/compact-yv-profile-safety-v31
      - name: Validate frozen state
        run: |
          python scripts/validate_benchmark.py research/benchmark/v31/yv-profile-safety/multi-parent-auto.jsonl
          python -m json.tool research/benchmark/v31/yv-profile-safety/manifest.json >/dev/null
          grep -F 'compact high-volume **YV reference-profile multi-parent ambiguity** slice' docs/research-plan.md
          grep -F 'remaining small safety requirement is hard-negative/no-match/abstention judgment' docs/findings/compact-yv-profile-safety-v31.md
      - name: Commit frozen safety evidence and SSOT
        run: |
          set -euo pipefail
          git config user.name "kingkongola"
          git config user.email "adambergman90@gmail.com"
          git add \
            research/benchmark/v31/yv-profile-safety \
            docs/findings/compact-yv-profile-safety-v31.md \
            docs/research-plan.md
          git commit -m "benchmark: freeze compact YV profile safety slices"
          git push origin HEAD:main
