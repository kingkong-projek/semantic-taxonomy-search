name: Sync Pareto SSOT

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-pareto-ssot.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch SSOT
        run: |
          echo '' | base64 -d > /tmp/patch_pareto.py
          python3 /tmp/patch_pareto.py
      - name: Validate policy markers
        run: |
          grep -F '### 2.1 Pareto / simple-first delivery principle' docs/research-plan.md
          grep -F 'compact 500–1,000 case decision benchmark' docs/research-plan.md
          grep -F 'Complexity has a burden of proof' docs/research-plan.md
      - name: Commit SSOT change
        run: |
          git config user.name kingkongola
          git config user.email adambergman90@gmail.com
          git add docs/research-plan.md
          git commit -m 'research: adopt Pareto simple-first delivery policy'
          git push origin HEAD:main
