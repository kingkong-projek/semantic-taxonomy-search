name: Sync executable zero-cost teacher pool into SSOT once

on:
  push:
    branches: [main]
    paths:
      - scripts/sync_teacher_pool_ssot_once.py
      - .github/workflows/sync-teacher-pool-ssot-once.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply teacher-pool SSOT patch
        run: python scripts/sync_teacher_pool_ssot_once.py
      - name: Commit SSOT if changed
        run: |
          if git diff --quiet -- docs/research-plan.md; then
            echo "No SSOT change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research-plan.md
          git commit -m "research: constrain teacher pool to zero-cost hosted models"
          git push origin HEAD:main
