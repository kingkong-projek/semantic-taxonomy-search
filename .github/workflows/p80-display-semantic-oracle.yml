name: P80 semantic Top-5 relevance oracle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p80-display-semantic-oracle.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p80-display-semantic-oracle-v0
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile-check semantic oracle
        run: |
          python -m py_compile \
            scripts/evaluate_p80_display_semantic_oracle.py \
            scripts/replay_p80_display_semantic_oracle_opened.py
      - name: Run prefrozen 2024 semantic sufficiency test
        run: |
          # Earlier attempts produced zero parsed judgments: first quota exhaustion,
          # then an array-vs-object JSON envelope mismatch. The parser now accepts
          # both envelopes; semantic prompt/model/evidence/verdict/gates are unchanged.
          python scripts/evaluate_p80_display_semantic_oracle.py \
            --batch-size 6 \
            --requests-per-minute 3
      - name: Check primary gate
        id: gate
        run: |
          python - <<'PY'
          import json, os
          p='research/evaluation/v31/p80-display-semantic-oracle-v0.json'
          r=json.load(open(p, encoding='utf-8'))
          g=r['decision_gate']
          passed=bool(g['strong_passed'] or g['promising_passed'])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"passed={'true' if passed else 'false'}\n")
          print(json.dumps({'strong':g['strong_passed'],'promising':g['promising_passed']}, indent=2))
          PY
      - name: Replay exact frozen oracle on opened user-style stress
        if: steps.gate.outputs.passed == 'true'
        run: python scripts/replay_p80_display_semantic_oracle_opened.py
      - name: Freeze oracle evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            research/evaluation/v31/p80-display-semantic-oracle-judgments-v0.jsonl \
            research/evaluation/v31/p80-display-semantic-oracle-v0.json
          if [ -f research/evaluation/v31/p80-display-semantic-oracle-opened-replay-v0.json ]; then
            git add research/evaluation/v31/p80-display-semantic-oracle-opened-replay-v0.json
          fi
          git commit -m 'research: freeze semantic Top-5 relevance oracle result'
          git pull --rebase origin main
          git push
      - name: Upload oracle audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p80-display-semantic-oracle-v0
          path: |
            research/evaluation/v31/p80-display-semantic-oracle-judgments-v0.jsonl
            research/evaluation/v31/p80-display-semantic-oracle-v0.json
            research/evaluation/v31/p80-display-semantic-oracle-opened-replay-v0.json
          if-no-files-found: warn
