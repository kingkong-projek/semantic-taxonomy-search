name: Sync fresh C2 SSOT once

on:
  push:
    branches: [main]
    paths:
      - scripts/sync_c2_fresh_ssot_once.py
      - .github/workflows/sync-c2-fresh-ssot-once.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch SSOT
        run: python scripts/sync_c2_fresh_ssot_once.py
      - name: Verify intended state
        run: |
          grep -Fq '100% positive-intent Discovery@5 (5/5)' docs/research-plan.md
          grep -Fq 'next core gap: natural-language skill discovery' docs/research-plan.md
          grep -Fq 'D typed graph/ESCO remains deferred' docs/research-plan.md
      - name: Commit SSOT
        run: |
          if git diff --quiet -- docs/research-plan.md; then echo 'already synced'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research-plan.md
          git commit -m 'research: sync independent C2 validation into SSOT'
          git push origin HEAD:main
