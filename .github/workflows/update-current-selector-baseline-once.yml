name: Update current selector baseline once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-current-selector-baseline-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch YV replay to current production behavior and expose alias collision stats
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/evaluate_findability_should_find.mjs')
          s = p.read_text(encoding='utf-8')
          replacements = [
            (
              'current search.utils.ts deduplicates fuzzy candidates by job-title id,\n * while contextual rows share that id. Exact/direct search does not have this issue.',
              'current search.utils.ts preserves fuzzy candidates by contextual row identity\n * (`job-title id + occupation-name id`), matching the production fix merged in YV PR #35.'
            ),
            (
              "function rowKey(r){return `${r.id}|${r.occupation_name_id??''}`;}\n",
              "function rowKey(r){return `${r.id}|${r.occupation_name_id??''}`;}\nfunction searchIdentity(r){return r.type==='job-title'?`${r.id}|${r.occupation_name_id??''}`:r.id;}\n"
            ),
            (
              "    // IMPORTANT: mirror production exactly. Fuzzy dedupe is by item.id, not contextual row key.\n    const processedIds=new Set();\n    for(const fr of raw){if(processedIds.has(fr.item.id))continue;const rs=fr.score??1,base=1-rs;if(base<MIN_FUZZY_SCORE)continue;if(rs>best+.12)continue;const root=rootMatch(q,norm(fr.item.preferred_label));if(root&&rs<=.25)strong=true;let score=base*.70+Number(fr.item.weight??0)*.10+(root?.12:0);score=Math.min(MAX_FUZZY_SCORE,Math.max(MIN_FUZZY_SCORE,score));candidates.push({...fr.item,score,displayLabel:displayLabel(fr.item)});processedIds.add(fr.item.id);}",
              "    // IMPORTANT: mirror current production exactly. Fuzzy dedupe preserves each published job-title context row.\n    const processedIdentities=new Set();\n    for(const fr of raw){const identity=searchIdentity(fr.item);if(processedIdentities.has(identity))continue;const rs=fr.score??1,base=1-rs;if(base<MIN_FUZZY_SCORE)continue;if(rs>best+.12)continue;const root=rootMatch(q,norm(fr.item.preferred_label));if(root&&rs<=.25)strong=true;let score=base*.70+Number(fr.item.weight??0)*.10+(root?.12:0);score=Math.min(MAX_FUZZY_SCORE,Math.max(MIN_FUZZY_SCORE,score));candidates.push({...fr.item,score,displayLabel:displayLabel(fr.item)});processedIdentities.add(identity);}" 
            ),
            (
              "selector_contract:{yv_search_utils_blob:'711769d019d01539b958776467e42dbafa46d9c1',yv_constants_blob:'e9a412778d77de1aef82da94e36559619f5d607c',fuse_js_version:FUSE_VERSION,yv_fuzzy_dedupe_key:'job-title id'}",
              "selector_contract:{yv_repository_commit:'ab0b3f28576d8aebec2b593b771a70c7684b1eca',yv_search_utils_blob:'1eb706399ff97634b556164061e651a024b98003',yv_constants_blob:'e9a412778d77de1aef82da94e36559619f5d607c',fuse_js_version:FUSE_VERSION,yv_fuzzy_dedupe_key:'job-title id + occupation-name context'}"
            ),
          ]
          for old, new in replacements:
              if old not in s:
                  raise RuntimeError(f'evaluator patch anchor missing: {old[:100]!r}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('scripts/build_findability_should_find_cases.py')
          s = p.read_text(encoding='utf-8')
          old = '''    grouped: dict[tuple[str, str], list[dict[str, Any]]] = collections.defaultdict(list)\n    for row in surfaces:\n        grouped[(row["product"], norm(row["query"]))].append(row)\n\n    occurrence: dict[str, int] = {}\n'''
          new = '''    grouped: dict[tuple[str, str], list[dict[str, Any]]] = collections.defaultdict(list)\n    for row in surfaces:\n        grouped[(row["product"], norm(row["query"]))].append(row)\n\n    # Track canonical alias ambiguity before decision-bearing collision filtering.\n    # This answers whether a cheap exact-alias lane is intrinsically safe without\n    # conflating replacement/history labels with synonym vocabulary.\n    canonical_alias_groups: dict[tuple[str, str], list[dict[str, Any]]] = collections.defaultdict(list)\n    for row in surfaces:\n        if row["surface_provenance"] in {"canonical_alternative_label", "canonical_hidden_label"}:\n            canonical_alias_groups[(row["product"], norm(row["query"]))].append(row)\n    canonical_alias_surface_collisions: dict[str, dict[str, int | float]] = {}\n    for product in ("YV", "KV"):\n        groups = [rows for (p, _), rows in canonical_alias_groups.items() if p == product]\n        unique = [rows for rows in groups if len({(str(r["target_type"]), str(r["target_id"])) for r in rows}) == 1]\n        ambiguous = [rows for rows in groups if len({(str(r["target_type"]), str(r["target_id"])) for r in rows}) > 1]\n        canonical_alias_surface_collisions[product] = {\n            "distinct_normalized_surfaces": len(groups),\n            "unique_target_surfaces": len(unique),\n            "ambiguous_target_surfaces": len(ambiguous),\n            "ambiguous_target_surface_pct": round(100.0 * len(ambiguous) / len(groups), 3) if groups else 0.0,\n        }\n\n    occurrence: dict[str, int] = {}\n'''
          if old not in s:
              raise RuntimeError('builder grouped anchor missing')
          s = s.replace(old, new, 1)
          old = '''        "counts": {\n            "all_cases": len(cases),\n'''
          new = '''        "canonical_alias_surface_collisions": canonical_alias_surface_collisions,\n        "counts": {\n            "all_cases": len(cases),\n'''
          if old not in s:
              raise RuntimeError('builder manifest anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Update findability workflow with alias ablation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/findability-should-find-audit.yml')
          s=p.read_text(encoding='utf-8')
          old='''      - name: Guard result boundaries\n        run: |\n'''
          new='''      - name: Measure canonical alias rescue\n        run: |\n          python3 scripts/analyze_canonical_alias_rescue.py \\\n            --cases artifacts/findability-should-find-v31/cases.jsonl \\\n            --evaluation artifacts/findability-should-find-v31/evaluation.json \\\n            --manifest artifacts/findability-should-find-v31/manifest.json \\\n            --output artifacts/findability-should-find-v31/canonical-alias-rescue.json\n\n      - name: Guard result boundaries\n        run: |\n'''
          if old not in s:
              raise RuntimeError('workflow guard anchor missing')
          s=s.replace(old,new,1)
          old='''          assert r['selector_contract']['fuse_js_version']=='7.5.0'\n'''
          new='''          assert r['selector_contract']['fuse_js_version']=='7.5.0'\n          assert r['selector_contract']['yv_repository_commit']=='ab0b3f28576d8aebec2b593b771a70c7684b1eca'\n          a=json.loads(Path('artifacts/findability-should-find-v31/canonical-alias-rescue.json').read_text())\n          assert a['track']=='1-current-yv-kv-findability'\n'''
          if old not in s:
              raise RuntimeError('workflow contract anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify and commit
        run: |
          python3 -m py_compile scripts/build_findability_should_find_cases.py scripts/analyze_canonical_alias_rescue.py
          git diff --check
          rm .github/workflows/update-current-selector-baseline-once.yml
          git config user.name semantic-taxonomy-search-bot
          git config user.email semantic-taxonomy-search-bot@users.noreply.github.com
          git add scripts/evaluate_findability_should_find.mjs scripts/build_findability_should_find_cases.py scripts/analyze_canonical_alias_rescue.py .github/workflows/findability-should-find-audit.yml .github/workflows/update-current-selector-baseline-once.yml
          git commit -m 'research: replay should-find against current YV and measure aliases'
          git push origin HEAD:main
