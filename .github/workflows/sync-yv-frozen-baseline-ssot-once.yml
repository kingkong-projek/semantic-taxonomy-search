name: Sync frozen YV baseline SSOT once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-yv-frozen-baseline-ssot-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch living research plan fail-closed
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/research-plan.md')
          text = p.read_text(encoding='utf-8')

          old_result = """Current Track-2 result: the earlier YV C2 evidence is retained as a bounded P80/router regression result, but **C2 is no longer the occupation-description candidate**. Its arbitrary-description BM25 lane can rank only 165 occupation identities (P80 + six frozen boundary occupations), while the Track-2 occupation target space is the active `occupation-name` universe (**2,105 identities**). A valid active occupation outside those 165 therefore cannot be classified as an out-of-envelope description failure merely because C2 cannot return it. Occupation research is reset to a separate full-universe candidate, `YV-description-full-v0`: all 2,105 active occupation-name identities with canonical label/definition/alternative-label text, exact active job-title→typed occupation-parent routing kept as a separate source-attested route, and AF ad-keyword employer language kept as a separate non-canonical evidence lane. C2 remains a regression/demo reference. No lane fusion, embeddings, neural reranking or generated teacher text is promoted by this correction. For skills, **`KV-G1-4slot` remains the independently source-attested base**, while the strongest current low-complexity research candidate remains **`KV-G1+T3`**: preserve canonical C0 rank 1, admit one unique candidate from the existing G1 BM25 lane, then admit three unique candidates from a second BM25 view containing the same G1 evidence plus three frozen teacher phrases per P80 skill. Runtime still uses no language model, embeddings/vector index, learned reranker, score calibration or query classifier."""
          new_result = """Current Track-2 result: the earlier YV C2 evidence is retained as a bounded P80/router regression result, but **the occupation-description candidate is now frozen as `YV-description-full-v0-canonical-router`**: all **2,105** active v31 `occupation-name` identities ranked from canonical preferred label + real definition + canonical alternative labels, plus the existing privileged exact active job-title→typed occupation-parent route. On the frozen 333-case YV source-truth suite, expanding the same ranker from 165 to 2,105 candidates preserves **333/333 Top1, 333/333 Hit@5 and MRR 1.0 with zero rank changes**. On a strict leak-free, source-attested but already-opened 17-case Yrkesinformation `work_task` diagnostic, full canonical retrieval reaches **9/17 Hit@5** versus **1/17** for the old 165-target universe. Separate AF ad-language and Relevanta-kompetenser lanes are genuinely complementary (oracle union **15/17**), but fixed slots, one concatenated BM25 document and standard equal-weight RRF failed to preserve that complementarity without ranking damage; they are therefore **not promoted**. Ad/skill context remains diagnostic candidate evidence for future independent residuals, not active runtime fusion. C2 remains a regression/demo reference. Evidence: `docs/findings/yv-full-universe-description-baseline-v31.md` and `research/evaluation/v31/yv-full-universe-description-baseline.json`. For skills, **`KV-G1-4slot` remains the independently source-attested base**, while the strongest current low-complexity research candidate remains **`KV-G1+T3`**: preserve canonical C0 rank 1, admit one unique candidate from the existing G1 BM25 lane, then admit three unique candidates from a second BM25 view containing the same G1 evidence plus three frozen teacher phrases per P80 skill. Runtime still uses no language model, embeddings/vector index, learned reranker, score calibration or query classifier."""

          old_human = """**Human-gate status (2026-09-07): skill collection-ready; occupation collection blocked pending a frozen full-universe candidate.** The no-example participant prompt, blind adjudication rules, staged case validator, preregistration template, preregistration→manifest SHA binding, raw-text-free need/prevalence funnel format and repository stage-order guard are in place. The structured contract now treats **all 2,105 active v31 occupation-name identities** as the occupation capability universe; historical P80 membership is a demand-priority stratum, not an occupation eligibility boundary. The skill stream remains ready once preregistration is frozen. The occupation stream must not collect participants until `YV-description-full-v0` has been built, evaluated and frozen. No real human description, adjudication or outcome file is present in the repository yet. Before the first participant in any enabled stream, `preregistration.json` must replace all template placeholders and be committed with status `frozen-before-first-participant`; retrieval may run only after elicitation and blind adjudication are frozen and a manifest binds all three SHA-256 values. A recruited capability study must not be reported as production prevalence without the separate eligible lexical-failure denominator."""
          new_human = """**Human-gate status (2026-09-07): candidate-construction gates are cleared for both streams; collection has not started.** The occupation candidate is now frozen as `YV-description-full-v0-canonical-router`, and the structured contract treats **all 2,105 active v31 occupation-name identities** as the occupation capability universe; historical P80 membership is a demand-priority stratum, not an occupation eligibility boundary. The skill candidate remains plain `KV-G1+T3`. The no-example participant prompt, blind adjudication rules, staged case validator, preregistration template, preregistration→manifest SHA binding, raw-text-free need/prevalence funnel format and repository stage-order guard are in place. No real human description, adjudication or outcome file is present in the repository yet. **Neither stream may begin collection from the template state:** before the first participant in any enabled stream, `preregistration.json` must replace all placeholders, satisfy the approved recruitment/data-handling requirements and be committed with status `frozen-before-first-participant`; retrieval may run only after elicitation and blind adjudication are frozen and a manifest binds all three SHA-256 values. A recruited capability study must not be reported as production prevalence without the separate eligible lexical-failure denominator."""

          for label, old, new in (("Track-2 result", old_result, new_result), ("human gate", old_human, new_human)):
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one {label} paragraph, found {text.count(old)}; refusing broad edit')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit SSOT update and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sync-yv-frozen-baseline-ssot-once.yml
          git add docs/research-plan.md
          git diff --cached --exit-code && exit 0
          git commit -m 'docs: freeze full-universe YV baseline in SSOT'
          git push
