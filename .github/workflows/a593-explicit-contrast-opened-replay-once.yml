name: A593 explicit contrast opened replay once

on:
  push:
    paths:
      - .github/workflows/a593-explicit-contrast-opened-replay-once.yml

permissions:
  contents: write
  actions: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download frozen A593 teacher corpus
        uses: actions/download-artifact@v4
        with:
          name: gemma-a593-checkpoint
          path: artifacts/a593
          github-token: ${{ github.token }}
          run-id: 34232985249
      - name: Compile-check replay
        run: >-
          python -m py_compile
          scripts/evaluate_gemma_a149.py
          scripts/evaluate_gemma_a593_sparse_paper_note.py
          scripts/evaluate_gemma_a593_hard_negative_distillation.py
          scripts/evaluate_gemma_a593_relation_aware_negatives.py
          scripts/evaluate_gemma_a593_sniper_contrasts.py
          scripts/evaluate_gemma_a593_explicit_contrast_layer.py
          scripts/evaluate_gemma_a593_explicit_contrast_opened_replay.py
      - name: Run one-time opened replay
        run: >-
          python scripts/evaluate_gemma_a593_explicit_contrast_opened_replay.py
          --teacher artifacts/a593/gemma-a593-teacher.jsonl
          --output artifacts/a593-explicit-contrast-opened-replay.json
      - name: Freeze result and self-remove
        run: |
          cp artifacts/a593-explicit-contrast-opened-replay.json research/evaluation/v31/compile-time-semantic-a593-explicit-contrast-opened-replay.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/a593-explicit-contrast-opened-replay-once.yml
          git add research/evaluation/v31/compile-time-semantic-a593-explicit-contrast-opened-replay.json .github/workflows/a593-explicit-contrast-opened-replay-once.yml
          git commit -m 'research: freeze A593 explicit contrast opened replay'
          git fetch origin main
          git rebase origin/main
          git push
