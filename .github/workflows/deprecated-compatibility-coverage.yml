name: Deprecated compatibility coverage

on:
  workflow_dispatch:
    inputs:
      taxonomy_version:
        description: Taxonomy target version
        required: true
        default: "31"
  push:
    branches: [main]
    paths:
      - "scripts/deprecated_compatibility_coverage.py"
      - ".github/workflows/deprecated-compatibility-coverage.yml"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Measure deprecated replacement graph and product routing
        env:
          TAXONOMY_VERSION: ${{ github.event.inputs.taxonomy_version || '31' }}
        run: |
          python scripts/deprecated_compatibility_coverage.py \
            --version "$TAXONOMY_VERSION" \
            --output-dir "artifacts/deprecated-compatibility-v${TAXONOMY_VERSION}"
      - uses: actions/upload-artifact@v4
        with:
          name: deprecated-compatibility-v${{ github.event.inputs.taxonomy_version || '31' }}
          path: artifacts/deprecated-compatibility-v${{ github.event.inputs.taxonomy_version || '31' }}/
          if-no-files-found: error
