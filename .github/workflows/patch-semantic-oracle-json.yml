name: Patch semantic oracle JSON transport

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-semantic-oracle-json.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Accept array-shaped JSON envelope
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/evaluate_p80_display_semantic_oracle.py')
          s=p.read_text(encoding='utf-8')
          anchor='''MODEL = gemma.MODEL\n'''
          patch='''def _tolerant_extract_json(payload: dict[str, Any]) -> dict[str, Any]:\n    candidates = payload.get("candidates") or []\n    if not candidates:\n        raise RuntimeError("no candidates")\n    parts = candidates[0].get("content", {}).get("parts") or []\n    text = "".join(\n        str(part.get("text") or "")\n        for part in parts\n        if isinstance(part, dict) and not part.get("thought")\n    ).strip()\n    if not text:\n        raise RuntimeError("no response text")\n    value = json.loads(text)\n    if isinstance(value, list):\n        return {"items": value}\n    if isinstance(value, dict):\n        return value\n    raise RuntimeError("response JSON must be object or array")\n\n\ngemma.extract_json = _tolerant_extract_json\n\n\n'''
          if '_tolerant_extract_json' in s:
              raise SystemExit('already patched')
          if anchor not in s:
              raise SystemExit('model anchor drift')
          s=s.replace(anchor, patch+anchor, 1)
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile scripts/evaluate_p80_display_semantic_oracle.py scripts/replay_p80_display_semantic_oracle_opened.py
      - name: Commit parser-only patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/evaluate_p80_display_semantic_oracle.py
          git commit -m 'research: tolerate semantic oracle JSON array envelope'
          git pull --rebase origin main
          git push
