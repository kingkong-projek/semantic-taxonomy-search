name: Fold A593 language diversity decision once

on:
  push:
    paths:
      - .github/workflows/fold-a593-language-diversity-decision-once.yml

permissions:
  contents: write

jobs:
  fold:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fold decision into living plan
        run: python scripts/fold_a593_language_diversity_decision.py
      - name: Commit and self-remove patch machinery
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/fold-a593-language-diversity-decision-once.yml scripts/fold_a593_language_diversity_decision.py
          git add docs/research-plan.md .github/workflows/fold-a593-language-diversity-decision-once.yml scripts/fold_a593_language_diversity_decision.py
          git commit -m 'docs: fold A593 language-diversity decision into research plan'
          git fetch origin main
          git rebase origin/main
          git push
