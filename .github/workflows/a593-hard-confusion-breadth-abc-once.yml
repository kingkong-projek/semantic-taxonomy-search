name: A593 hard-confusion breadth A B C once

on:
  push:
    paths:
      - .github/workflows/a593-hard-confusion-breadth-abc-once.yml

permissions:
  contents: write
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install diagnostic dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy scikit-learn
      - name: Download frozen A593 teacher corpus
        uses: actions/download-artifact@v4
        with:
          name: gemma-a593-checkpoint
          path: artifacts/a593
          github-token: ${{ github.token }}
          run-id: 34232985249
      - name: Compile-check frozen generator and evaluator
        run: >-
          python -m py_compile
          scripts/generate_gemma4_yv_teacher_pilot.py
          scripts/generate_a593_breadth_proxy.py
          scripts/generate_a593_task_atoms_for_confusion_pairs.py
          scripts/evaluate_a593_confusion_breadth_abc.py
      - name: Generate independent C task atoms
        run: >-
          python scripts/generate_a593_task_atoms_for_confusion_pairs.py
          --requests-per-minute 6
          --output artifacts/a593-confusion-task-atoms-v0.json
      - name: Freeze task atoms before evaluation
        run: cp artifacts/a593-confusion-task-atoms-v0.json research/evaluation/v31/compile-time-semantic-a593-confusion-task-atoms-v0.json
      - name: Download public v31 taxonomy for common A source evidence
        run: >-
          python -c "import urllib.request; urllib.request.urlretrieve('https://data.jobtechdev.se/taxonomy/version/31/query/concepts-and-common-relations/concepts-and-common-relations.json','artifacts/taxonomy-v31.json')"
      - name: Evaluate frozen hard-confusion gate
        run: >-
          python scripts/evaluate_a593_confusion_breadth_abc.py
          --teacher artifacts/a593/gemma-a593-teacher.jsonl
          --task-atoms research/evaluation/v31/compile-time-semantic-a593-confusion-task-atoms-v0.json
          --taxonomy artifacts/taxonomy-v31.json
          --output artifacts/a593-hard-confusion-breadth-abc.json
      - name: Freeze result and self-remove
        run: |
          cp artifacts/a593-hard-confusion-breadth-abc.json research/evaluation/v31/compile-time-semantic-a593-hard-confusion-breadth-abc.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/a593-hard-confusion-breadth-abc-once.yml
          git add research/evaluation/v31/compile-time-semantic-a593-confusion-task-atoms-v0.json research/evaluation/v31/compile-time-semantic-a593-hard-confusion-breadth-abc.json .github/workflows/a593-hard-confusion-breadth-abc-once.yml
          git commit -m 'research: freeze hard-confusion A593 breadth gate'
          git fetch origin main
          git rebase origin/main
          git push
