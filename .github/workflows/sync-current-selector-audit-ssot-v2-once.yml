name: Guarded selector audit SSOT sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-current-selector-audit-ssot-v2-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch SSOT
        run: python scripts/sync_current_selector_audit_ssot_once.py
      - name: Validate and commit
        run: |
          grep -Fq '96.073%' docs/research-plan.md
          grep -Fq '645 non-first context rows' docs/research-plan.md
          grep -Fq 'further Gate-3 semantic expansion is paused' docs/research-plan.md
          git diff --check
          git config user.name semantic-taxonomy-search-bot
          git config user.email semantic-taxonomy-search-bot@users.noreply.github.com
          git add docs/research-plan.md
          git commit -m 'research: make selector failures gate semantic expansion'
          git push origin HEAD:main
