name: Track 1 alias boundary discrepancy once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/track1-alias-boundary-diff-once.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout pinned YV generator
        env:
          SOURCE_COMMIT: 6dd9e4737d7db3cb2709f8082808b88e5c89ed6e
        run: |
          rm -rf /tmp/yv-generator
          git init -q /tmp/yv-generator
          git -C /tmp/yv-generator remote add origin https://gitlab.com/arbetsformedlingen/taxonomy-dev/backend/yrkesvaljaren.git
          git -C /tmp/yv-generator fetch -q --depth 1 origin "$SOURCE_COMMIT"
          git -C /tmp/yv-generator checkout -q --detach FETCH_HEAD
          printf '%s\n' "$SOURCE_COMMIT" > /tmp/yv-generator/SOURCE_COMMIT.txt
      - name: Rebuild source-attested packet
        run: |
          rm -rf artifacts/findability-should-find-v31
          python3 scripts/build_findability_should_find_cases.py \
            --version 31 \
            --generator-dir /tmp/yv-generator \
            --output-dir artifacts/findability-should-find-v31
      - name: Compare canonical-only strict alias set with packet
        run: |
          python3 - <<'PY'
          import json, unicodedata, urllib.request
          from collections import defaultdict
          from pathlib import Path
          from scripts.deprecated_compatibility_coverage import as_strings, graphql

          def norm(x):
              return unicodedata.normalize('NFC', str(x or '')).casefold().strip()

          with urllib.request.urlopen('https://data.arbetsformedlingen.se/kompetens/kompetensvaljaren/v1/kompetensvaljaren-t31.json', timeout=60) as r:
              kv=json.load(r)
          cats=('regulated_skills','essential_skills','optional_skills','calculated_skills','related_skills')
          skills={}
          for node in (kv.get('data') or {}).values():
              if not isinstance(node,dict): continue
              for cat in cats:
                  val=node.get(cat)
                  if isinstance(val,dict):
                      for label,cid in val.items():
                          if isinstance(label,str) and isinstance(cid,str): skills[cid]=label
              if node.get('type') is None and not node.get('preferred_label'):
                  for label,cid in node.items():
                      if isinstance(label,str) and isinstance(cid,str): skills[cid]=label
          valid=set(skills)

          q='''query AliasDiff { concepts(type: "skill", version: "31", include_deprecated: false, limit: 50000) { id preferred_label type deprecated alternative_labels hidden_labels } }'''
          _,doc,_=graphql(q)
          rows=(doc.get('data') or {}).get('concepts') or []
          grouped=defaultdict(set); exemplar={}
          for c in rows:
              if not isinstance(c,dict) or c.get('id') not in valid: continue
              pref=norm(c.get('preferred_label'))
              for v in as_strings(c.get('alternative_labels'))+as_strings(c.get('hidden_labels')):
                  n=norm(v)
                  if n and n != pref:
                      grouped[n].add(c['id']); exemplar[(n,c['id'])]=v
          preferred=defaultdict(set)
          for cid,label in skills.items(): preferred[norm(label)].add(cid)
          strict={
              (n,next(iter(targets)))
              for n,targets in grouped.items()
              if len(targets)==1
              and not preferred.get(n,set())
          }

          packet=set(); packet_rows={}
          for line in Path('artifacts/findability-should-find-v31/cases.jsonl').read_text(encoding='utf-8').splitlines():
              if not line.strip(): continue
              c=json.loads(line)
              if c.get('product')!='KV': continue
              prov=set(c.get('surface_provenance') or [])
              if not prov.intersection({'canonical_alternative_label','canonical_hidden_label'}): continue
              key=(norm(c.get('query')), str((c.get('target') or {}).get('concept_id') or ''))
              packet.add(key); packet_rows[key]=c

          only_strict=sorted(strict-packet)
          only_packet=sorted(packet-strict)
          def describe(keys):
              return [{
                  'normalized':n,
                  'query': exemplar.get((n,cid)) or (packet_rows.get((n,cid)) or {}).get('query'),
                  'target_id':cid,
                  'preferred_label':skills.get(cid),
                  'packet_source_rows': (packet_rows.get((n,cid)) or {}).get('source_rows'),
              } for n,cid in keys]
          print(json.dumps({
              'canonical_strict':len(strict),
              'packet_canonical_cases':len(packet),
              'intersection':len(strict & packet),
              'only_canonical_strict':describe(only_strict),
              'only_packet':describe(only_packet),
          }, ensure_ascii=False, indent=2))
          assert len(strict)==1279
          assert len(only_strict)==1
          assert len(only_packet)==10
          PY
