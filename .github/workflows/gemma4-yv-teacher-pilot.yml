name: Gemma 4 YV teacher hour run

on:
  push:
    paths:
      - scripts/generate_gemma4_yv_teacher_pilot.py
      - .github/workflows/gemma4-yv-teacher-pilot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teacher-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile-check teacher runner
        run: python -m py_compile scripts/generate_gemma4_yv_teacher_pilot.py
      - name: Generate 150 public-data occupations at conservative rate
        run: >-
          python scripts/generate_gemma4_yv_teacher_pilot.py
          --cases 150
          --requests-per-minute 3
          --output artifacts/gemma4-yv-teacher-hour-run.jsonl
      - name: Upload generated corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemma4-yv-teacher-hour-run
          path: artifacts/gemma4-yv-teacher-hour-run.jsonl
          if-no-files-found: warn
