name: Freeze blind skill holdout result once

on:
  push:
    branches: [main]
    paths:
      - scripts/sync_skill_fresh_holdout_result.py
      - .github/workflows/freeze-skill-fresh-holdout-result-once.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  freeze:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reproduce independent result
        run: python scripts/evaluate_skill_fresh_holdout.py --output artifacts/skill-fresh-holdout-v31.json
      - name: Sync frozen result and SSOT
        run: python scripts/sync_skill_fresh_holdout_result.py
      - name: Commit frozen decision
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/evaluation/v31/skill-fresh-holdout.json docs/findings/skill-fresh-holdout-v31.md docs/research-plan.md
          if git diff --cached --quiet; then
            echo 'No decision drift.'
            exit 0
          fi
          git commit -m 'research: reject skill F1 on blind holdout'
          git push origin HEAD:main
