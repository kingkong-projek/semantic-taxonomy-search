name: Sync research plan semantic v0 outcome

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-research-plan-semantic-v0-outcome.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/prepend_semantic_v0_research_plan.py
      - run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research-plan.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: sync plan with semantic oracle v0 outcome'
          git pull --rebase origin main
          git push
