name: P80 source-thin evidence audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p80-source-thin-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned decompressor
        run: python -m pip install --disable-pip-version-check zstandard==0.23.0
      - name: Compile-check source-thin audit
        run: python -m py_compile scripts/audit_p80_source_thin_evidence.py
      - name: Audit direct source-bound evidence
        run: python scripts/audit_p80_source_thin_evidence.py
      - name: Freeze audit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/evaluation/v31/p80-source-thin-evidence-audit.json
          git commit -m 'research: freeze P80 source-thin evidence audit'
          git push
