name: Track 1 persona product replay

on:
  push:
    branches: [main]
    paths:
      - research/personas/v31/journeys.jsonl
      - scripts/track1-persona-product-replay.spec.ts
      - .github/workflows/track1-persona-product-replay.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  replay:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout current patched YV/KV product repo
        env:
          YV_COMMIT: 1ad8c389a4f43caa5a704843487ca94419bf745a
        run: |
          rm -rf /tmp/yv-track1
          git init -q /tmp/yv-track1
          git -C /tmp/yv-track1 remote add origin https://github.com/kingkong-projek/yrkesvaljaren.git
          git -C /tmp/yv-track1 fetch -q --depth 1 origin "$YV_COMMIT"
          git -C /tmp/yv-track1 checkout -q --detach FETCH_HEAD
      - name: Install and build product test prerequisites
        run: |
          cd /tmp/yv-track1
          npm ci
          npm run build -w @taxonomy/core
      - name: Replay frozen Track-1 journeys using actual product engines
        env:
          YV_COMMIT: 1ad8c389a4f43caa5a704843487ca94419bf745a
          JOURNEYS_FILE: ${{ github.workspace }}/research/personas/v31/journeys.jsonl
          OUT_FILE: ${{ github.workspace }}/artifacts/track1-persona-product-replay-v31.json
        run: |
          cp scripts/track1-persona-product-replay.spec.ts /tmp/yv-track1/track1-persona-product-replay.spec.ts
          cd /tmp/yv-track1
          npx vitest run track1-persona-product-replay.spec.ts --reporter=verbose
      - name: Guard track separation
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('artifacts/track1-persona-product-replay-v31.json').read_text())
          assert x['track']=='1-current-yv-kv-findability'
          assert x['yv_commit']=='1ad8c389a4f43caa5a704843487ca94419bf745a'
          assert set(x['description_journeys_skipped'])=={'J12','J13','J14','J20'}
          assert x['included_journeys']==20
          assert not any('DESCRIPTION' in r['product'] for r in x['results'])
          print('Track 1 boundary preserved; description journeys were not replayed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: track1-persona-product-replay-v31
          path: artifacts/track1-persona-product-replay-v31.json
          if-no-files-found: error
          retention-days: 30
