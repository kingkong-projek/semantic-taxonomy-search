name: Compile-time semantic tournament round zero

on:
  push:
    branches: [main]
    paths:
      - scripts/evaluate_compile_time_tournament_round0.py
      - research/evaluation/v31/opened-live-semantic-stress-v1.json
      - research/enrichment/v31/model-teacher-kv-top100/phrases.jsonl
      - research/enrichment/v31/model-teacher-kv-ranks101-200/phrases.jsonl
      - research/enrichment/v31/model-teacher-kv-ranks201-300/phrases.jsonl
      - research/enrichment/v31/model-teacher-kv-ranks301-316/phrases.jsonl
      - .github/workflows/compile-time-tournament-round0.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: compile-time-tournament-round0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned research dependencies
        run: python -m pip install --disable-pip-version-check 'sentence-transformers==3.4.1' 'zstandard==0.23.0'
      - name: Compile-check round zero
        run: python -m py_compile scripts/evaluate_compile_time_tournament_round0.py
      - name: Evaluate B0 and C0
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: python scripts/evaluate_compile_time_tournament_round0.py
      - name: Upload tournament result
        uses: actions/upload-artifact@v4
        with:
          name: compile-time-tournament-round0-v31
          path: |
            artifacts/compile-time-tournament-round0-v31.json
            artifacts/compile-time-tournament-round0-assets/
          if-no-files-found: error
          retention-days: 30
