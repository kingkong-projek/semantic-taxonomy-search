name: Sync persona findability into SSOT once

on:
  push:
    branches: [main]
    paths:
      - scripts/sync_persona_findability_ssot_once.py
      - .github/workflows/sync-persona-findability-ssot-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync SSOT
        run: python3 scripts/sync_persona_findability_ssot_once.py
      - name: Verify and clean one-off machinery
        run: |
          grep -F '### 2.1.1 Persona-based experiential red-team' docs/research-plan.md
          grep -F 'research/personas/v31/personas.json' docs/research-plan.md
          rm scripts/sync_persona_findability_ssot_once.py
          rm .github/workflows/sync-persona-findability-ssot-once.yml
          git diff --check
      - name: Commit SSOT sync
        run: |
          git config user.name semantic-taxonomy-search-bot
          git config user.email semantic-taxonomy-search-bot@users.noreply.github.com
          git add docs/research-plan.md scripts/sync_persona_findability_ssot_once.py .github/workflows/sync-persona-findability-ssot-once.yml
          git commit -m 'research: make persona journeys part of findability SSOT'
          git pull --rebase origin main
          git push origin HEAD:main
