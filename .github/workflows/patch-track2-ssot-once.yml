name: Patch Track 2 SSOT once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-track2-ssot-once.yml
      - scripts/patch_track2_ssot_once.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch living research plan
        run: python scripts/patch_track2_ssot_once.py
      - name: Commit patched SSOT
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research-plan.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: activate Track 2 and lock frontend student runtime"
          git pull --rebase origin main
          git push origin HEAD:main
