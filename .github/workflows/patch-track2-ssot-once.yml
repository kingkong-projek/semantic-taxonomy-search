name: Patch current Track2 SSOT once

on:
  push:
    branches:
      - main
    paths:
      - scripts/patch_track2_ssot_once.py
      - .github/workflows/patch-track2-ssot-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on:
      - self-hosted
      - Linux
      - X64
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch SSOT
        run: python scripts/patch_track2_ssot_once.py
      - name: Commit SSOT
        shell: bash
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add docs/research-plan.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: sync Track2 simple retrieval boundary'
          git push origin HEAD:main
