name: P80 decision benchmark

on:
  push:
    branches: [main]
    paths:
      - scripts/build_p80_decision_benchmark.py
      - scripts/validate_benchmark.py
      - research/benchmark/schema/benchmark-case.schema.json
      - research/coverage/v31/pareto-demand-aggregate.json
      - research/coverage/source-adapters.json
      - .github/workflows/p80-decision-benchmark.yml
  workflow_dispatch:
    inputs:
      taxonomy_version:
        description: Taxonomy target version
        required: true
        default: "31"

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build compact P80 source-truth suite
        env:
          TAXONOMY_VERSION: ${{ github.event.inputs.taxonomy_version || '31' }}
        run: |
          python scripts/build_p80_decision_benchmark.py \
            --version "$TAXONOMY_VERSION" \
            --output-dir "artifacts/p80-benchmark-v${TAXONOMY_VERSION}"
      - name: Validate semantic benchmark invariants
        env:
          TAXONOMY_VERSION: ${{ github.event.inputs.taxonomy_version || '31' }}
        run: |
          python scripts/validate_benchmark.py \
            "artifacts/p80-benchmark-v${TAXONOMY_VERSION}/yv-p80-source-truth.jsonl" \
            "artifacts/p80-benchmark-v${TAXONOMY_VERSION}/kv-p80-source-truth.jsonl"
          python -m json.tool "artifacts/p80-benchmark-v${TAXONOMY_VERSION}/manifest.json" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: p80-decision-benchmark-v${{ github.event.inputs.taxonomy_version || '31' }}
          path: artifacts/p80-benchmark-v${{ github.event.inputs.taxonomy_version || '31' }}/
          if-no-files-found: error
          retention-days: 30
