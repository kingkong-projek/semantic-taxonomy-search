name: Patch resumable oracle short wire key

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-resumable-short-wire-key.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Add execution-only short case-key fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/run_p80_display_semantic_oracle_resumable.py')
          s = p.read_text(encoding='utf-8')
          old = '''    def call(batch: list[dict[str, Any]]):
        nonlocal last_call
        elapsed = time.monotonic() - last_call
        if last_call and elapsed < min_interval:
            time.sleep(min_interval - elapsed)
        raw, meta = oracle.call_semantic_with_quota_retry(api_key, oracle.prompt(batch, by_id, phrase_map))
        last_call = time.monotonic()
        return raw, meta
'''
          new = '''    def call_prompt(prompt_text: str):
        nonlocal last_call
        elapsed = time.monotonic() - last_call
        if last_call and elapsed < min_interval:
            time.sleep(min_interval - elapsed)
        raw, meta = oracle.call_semantic_with_quota_retry(api_key, prompt_text)
        last_call = time.monotonic()
        return raw, meta

    def call(batch: list[dict[str, Any]]):
        return call_prompt(oracle.prompt(batch, by_id, phrase_map))
'''
          if old not in s:
              raise SystemExit('call block not found')
          s = s.replace(old, new, 1)
          old2 = '''            if key not in state["judgments"]:
                previous = state["transport_failures"].get(key) or {}
                state["transport_failures"][key] = {
                    "attempts_this_run": single_case_attempts,
                    "runs_failed": int(previous.get("runs_failed", 0)) + 1,
                    "last_error": last_error,
                }
'''
          new2 = '''            # A model can occasionally echo or mutate a long opaque case_key while
            # still returning valid candidate verdicts. Retry once with only the wire
            # identifier shortened. Build the semantic payload first so query, evidence,
            # candidate membership and deterministic candidate order remain unchanged.
            if key not in state["judgments"] and last_error == "single-case response omitted case":
                try:
                    prompt_text = oracle.prompt([case], by_id, phrase_map)
                    shadow = dict(case)
                    shadow["ad_id"] = "wire-" + hashlib.sha256(key.encode("utf-8")).hexdigest()[:12]
                    short_key = oracle.case_key(shadow)
                    old_wire = json.dumps(key, ensure_ascii=False)
                    new_wire = json.dumps(short_key, ensure_ascii=False)
                    if prompt_text.count(old_wire) != 1:
                        raise RuntimeError("could not isolate case_key in frozen prompt payload")
                    raw, meta = call_prompt(prompt_text.replace(old_wire, new_wire, 1))
                    partial = oracle.parse_response(raw, [shadow], require_all=False)
                    state["usage_metadata"].append(meta)
                    if short_key in partial:
                        state["judgments"][key] = partial[short_key]
                        state["transport_failures"].pop(key, None)
                        write_checkpoint(checkpoint, status, state, cases, phase="running-short-wire-key-recovery")
                        print(f"semantic oracle recovered {key} via short opaque wire key", flush=True)
                    else:
                        last_error = "short-wire-key response omitted case"
                except Exception as exc:
                    last_error = f"short-wire-key {type(exc).__name__}: {exc}"[:600]

            if key not in state["judgments"]:
                previous = state["transport_failures"].get(key) or {}
                state["transport_failures"][key] = {
                    "attempts_this_run": single_case_attempts,
                    "runs_failed": int(previous.get("runs_failed", 0)) + 1,
                    "last_error": last_error,
                }
'''
          if old2 not in s:
              raise SystemExit('failure block not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile scripts/run_p80_display_semantic_oracle_resumable.py
      - name: Commit correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/run_p80_display_semantic_oracle_resumable.py
          git commit -m 'fix: recover malformed opaque oracle case keys'
          git pull --rebase origin main
          git push
