name: Sync A593 qualitative decision once

on:
  push:
    paths:
      - .github/workflows/sync-a593-qualitative-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update SSOT
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/research-plan.md')
          text = path.read_text(encoding='utf-8')
          old = "**Execution decision:** complete the deliberately unpruned teacher corpus across all 2,105 active YV identities, including an explicit retry pass for the seven currently invalid/missing teacher identities, then run the frozen A2105 falsification. Do not tune on the opened 17/88 suites. If the hard paraphrase residual persists at full coverage, the next A work is hard-negative/confusable discrimination plus pruning/down-weighting and abstention work, not another blind coverage expansion. Chunking remains unjustified by measured bytes."
          new = "**Execution decision after qualitative A593 review:** **PAUSE A2105/full Gemma generation. Work the existing A593 corpus first.** The opened stress replay is only a coarse architecture diagnostic and its current `family_rank` substring heuristic can both over-credit and under-credit results (for example, `Djurfysioterapeut` can satisfy `fysioterapeut`, while an excellent `Backend-utvecklare` result can miss the expected `systemutvecklare/programmerare` family). Qualitative inspection of A593 shows several mechanisms that can be tested without any new teacher calls: (1) flattening all eight teacher phrases into one BM25 document lets unrelated generic tokens accumulate across phrases; (2) colloquial generated tokens such as `står`, `fyller`, `går runt`, `hjälper`, `hitta rätt`, `kollar` and `ser till` can receive disproportionate sparse weight and attract unrelated concepts; (3) exact-token morphology leaves useful bridges unused (`katten/sjuk` versus `katter/sjuka`); (4) several remaining indirect queries need discrimination/paraphrase evidence rather than more concepts; and (5) abstention is still a separate unresolved problem. Next use only the frozen 593 concepts / 4,744 phrases to run corpus-internal, non-evaluation-leaking diagnostics: phrase-level versus flattened scoring, leave-one-phrase-out/self-retrieval, confusion-pair/hard-negative mining, generic-token/phrase analysis and the smallest morphology-normalization probes. The opened 17/88 suites may be replayed afterward only as diagnostics, never used to choose per-query fixes. Resume broad/full Gemma generation only if these A593 experiments show that missing concept coverage remains a material residual. Chunking remains unjustified by measured bytes."
          if old not in text:
              raise RuntimeError('expected A593 execution decision not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and self-remove
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/sync-a593-qualitative-once.yml
          git add docs/research-plan.md .github/workflows/sync-a593-qualitative-once.yml
          git commit -m 'docs: pause A2105 after qualitative A593 review'
          git push
