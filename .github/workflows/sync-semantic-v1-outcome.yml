name: Sync semantic v1 outcome into SSOT

on:
  push:
    paths:
      - '.github/workflows/sync-semantic-v1-outcome.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepend authoritative v1 outcome
        run: |
          python - <<'PY'
          from pathlib import Path

          ssot = Path('SSOT.md')
          s = ssot.read_text(encoding='utf-8')
          marker = '<!-- SEMANTIC-HARD-CONFUSION-V1-OUTCOME-2026-09-10 -->'
          if marker not in s:
              anchor = 'This file is the canonical entrypoint for **current execution state**. Historical experiments remain in `docs/findings/` and `research/`; they are evidence, not competing active plans.\n'
              block = '''\n\n## Latest amendment — semantic hard-confusion v1 failed\n\n<!-- SEMANTIC-HARD-CONFUSION-V1-OUTCOME-2026-09-10 -->\n\nThe preregistered independent 2022 hard-confusion v1 is complete. On 79 cases, richer positive canonical-derived task evidence preserved every structured target (**79/79 non-drop**) but rejected only **13/79 = 16.46%** paired hard negatives, versus **16/79 = 20.25%** for the frozen compact control. Delta: **-3.80 pp**. The target-safety gate passed; the >=70% absolute hard-negative gate and >=+10 pp materiality gate failed. Opened 17/88 was not loaded and must not be replayed for this failed mechanism.\n\n**Superseding execution decision:** adding more positive task description is rejected as the solution to adjacent-role display precision. The next bounded experiment must test **explicit source-grounded contrastive/discriminative evidence between plausible neighboring roles**, frozen before outcomes and evaluated on a new independent time slice. It must not encode negative occupational facts from absence, must not use opened outcomes, and must keep retrieval/rank order unchanged. No student/distillation until that independent contrastive gate and the subsequent unchanged opened falsifier both pass.\n\nEvidence: `docs/findings/semantic-display-hard-confusion-v1-2026-09-10.md` and `research/evaluation/v31/semantic-display-hard-confusion-v1-result.json`.\n'''
              if anchor not in s:
                  raise SystemExit('SSOT anchor missing')
              s = s.replace(anchor, anchor + block, 1)
              ssot.write_text(s, encoding='utf-8')

          plan = Path('docs/research-plan.md')
          p = plan.read_text(encoding='utf-8')
          if marker not in p:
              heading = '# Semantic Taxonomy Search — living research plan\n'
              block = '''\n\n**Semantic hard-confusion v1 outcome (2026-09-10) — AUTHORITATIVE.**\n\n<!-- SEMANTIC-HARD-CONFUSION-V1-OUTCOME-2026-09-10 -->\n\nThe preregistered independent 2022 hard-confusion v1 is complete and **failed**. The richer positive-task challenger retained **79/79** structured targets, but hard-negative rejection was only **13/79 = 16.46%**, versus **16/79 = 20.25%** for the frozen compact control (**-3.80 pp**). Safety passed; the preregistered >=70% absolute and >=+10 pp materiality gates failed. Opened 17/88 was not loaded and is not eligible for replay after this failure.\n\n**Decision:** do not add still more positive occupation/task prose and do not distill v1. The next single decision-bearing mechanism is **pairwise source-grounded contrast evidence**: positive distinctions attested in each candidate's supplied source evidence, selected by comparing the two plausible roles, without converting absence from the peer's source text into a claim that the peer cannot perform an activity. Freeze generation protocol and evaluation gate before outcomes; use an untouched historical time slice; keep retrieval/order unchanged; no opened replay unless the independent gate passes.\n\nA contrastive mechanism has a higher complexity burden than v0/v1. It must preserve >=98% target non-drop, reject >=70% independently paired hard negatives, materially outperform its compact-evidence control, and show breadth across pairs before it earns opened replay. Human/domain-expert relevance remains required for promotion.\n\nEvidence: `docs/findings/semantic-display-hard-confusion-v1-2026-09-10.md`, `research/evaluation/v31/semantic-display-hard-confusion-v1-preregistration.json`, and `research/evaluation/v31/semantic-display-hard-confusion-v1-result.json`.\n'''
              if heading not in p:
                  raise SystemExit('research-plan heading missing')
              p = p.replace(heading, heading + block, 1)
              plan.write_text(p, encoding='utf-8')
          PY
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SSOT.md docs/research-plan.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: sync failed semantic hard-confusion v1 outcome'
          git pull --rebase origin main
          git push
