name: Probe resolved Gate 1 sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_gate1_sources.py"
      - ".github/workflows/probe-gate1-sources.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned decompressor
        run: python -m pip install --disable-pip-version-check zstandard==0.23.0
      - name: Inspect schemas
        run: python scripts/probe_gate1_sources.py
