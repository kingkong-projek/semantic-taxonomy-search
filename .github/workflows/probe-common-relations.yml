name: Probe common relations distribution

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_common_relations.py"
      - ".github/workflows/probe-common-relations.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/probe_common_relations.py --version 31
