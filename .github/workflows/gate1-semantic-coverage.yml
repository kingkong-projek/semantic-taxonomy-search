name: Resolved Gate 1 semantic coverage

on:
  workflow_dispatch:
    inputs:
      taxonomy_version:
        description: Taxonomy version to measure
        required: true
        default: "31"
  push:
    branches: [main]
    paths:
      - "scripts/taxonomy_special_relations_coverage.py"
      - "scripts/derived_af_coverage.py"
      - ".github/workflows/gate1-semantic-coverage.yml"

permissions:
  contents: read

jobs:
  taxonomy-special:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Measure keyword and substitutability semantics
        env:
          TAXONOMY_VERSION: ${{ github.event.inputs.taxonomy_version || '31' }}
        run: |
          python scripts/taxonomy_special_relations_coverage.py \
            --version "$TAXONOMY_VERSION" \
            --output-dir "artifacts/taxonomy-special-relations-v${TAXONOMY_VERSION}"
      - uses: actions/upload-artifact@v4
        with:
          name: taxonomy-special-relations-v${{ github.event.inputs.taxonomy_version || '31' }}
          path: artifacts/taxonomy-special-relations-v${{ github.event.inputs.taxonomy_version || '31' }}/
          if-no-files-found: error

  derived-af:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned decompressor
        run: python -m pip install --disable-pip-version-check zstandard==0.23.0
      - name: Measure Relevanta kompetenser and ad-language semantics
        env:
          TAXONOMY_VERSION: ${{ github.event.inputs.taxonomy_version || '31' }}
        run: |
          python scripts/derived_af_coverage.py \
            --version "$TAXONOMY_VERSION" \
            --output-dir "artifacts/derived-af-coverage-v${TAXONOMY_VERSION}"
      - uses: actions/upload-artifact@v4
        with:
          name: derived-af-coverage-v${{ github.event.inputs.taxonomy_version || '31' }}
          path: artifacts/derived-af-coverage-v${{ github.event.inputs.taxonomy_version || '31' }}/
          if-no-files-found: error
