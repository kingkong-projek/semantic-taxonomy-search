name: Dense YV evidence lane diagnostic

on:
  push:
    branches: [main]
    paths:
      - scripts/evaluate_yv_dense_evidence_lanes.py
      - scripts/evaluate_dense_semantic_candidate_lane.py
      - research/evaluation/v31/opened-live-semantic-stress-v1.json
      - .github/workflows/yv-dense-evidence-lanes.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: dense-yv-evidence-lanes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned research dependencies
        run: python -m pip install --disable-pip-version-check 'sentence-transformers==3.4.1' 'zstandard==0.23.0'
      - name: Compile-check diagnostic
        run: python -m py_compile scripts/evaluate_yv_dense_evidence_lanes.py
      - name: Evaluate provenance-separated YV evidence lanes
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: python scripts/evaluate_yv_dense_evidence_lanes.py
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: yv-dense-evidence-lanes-v31
          path: artifacts/yv-dense-evidence-lanes-v31.json
          if-no-files-found: error
          retention-days: 30
