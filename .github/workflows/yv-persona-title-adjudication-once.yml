name: YV persona title adjudication once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/yv-persona-title-adjudication-once.yml

permissions:
  contents: read

jobs:
  adjudicate:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout pinned YV generator read-only
        env:
          SOURCE_COMMIT: 6dd9e4737d7db3cb2709f8082808b88e5c89ed6e
        run: |
          rm -rf /tmp/yv-generator-persona
          git init -q /tmp/yv-generator-persona
          git -C /tmp/yv-generator-persona remote add origin https://gitlab.com/arbetsformedlingen/taxonomy-dev/backend/yrkesvaljaren.git
          git -C /tmp/yv-generator-persona fetch -q --depth 1 origin "$SOURCE_COMMIT"
          git -C /tmp/yv-generator-persona checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/yv-generator-persona rev-parse HEAD)" = "$SOURCE_COMMIT"
          printf '%s\n' "$SOURCE_COMMIT" > /tmp/yv-generator-persona/SOURCE_COMMIT.txt
      - name: Adjudicate persona title cases
        run: |
          mkdir -p artifacts
          python scripts/adjudicate_yv_persona_title_cases.py \
            --generator-dir /tmp/yv-generator-persona \
            --output artifacts/yv-persona-title-adjudication-v31.json
      - uses: actions/upload-artifact@v4
        with:
          name: yv-persona-title-adjudication-v31
          path: artifacts/yv-persona-title-adjudication-v31.json
          retention-days: 30
          if-no-files-found: error
