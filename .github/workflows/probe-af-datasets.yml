name: Probe AF dataset distributions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_af_dataset_distributions.py"
      - ".github/workflows/probe-af-datasets.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve public distribution links and schemas
        run: python scripts/probe_af_dataset_distributions.py
