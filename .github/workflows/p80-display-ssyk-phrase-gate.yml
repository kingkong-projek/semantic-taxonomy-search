name: P80 SSYK plus phrase display falsifier

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p80-display-ssyk-phrase-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile-check
        run: python -m py_compile scripts/evaluate_p80_display_ssyk_phrase_gate.py
      - name: Evaluate
        run: python scripts/evaluate_p80_display_ssyk_phrase_gate.py
      - name: Freeze result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/evaluation/v31/p80-display-ssyk-phrase-gate-v0.json
          git commit -m 'research: freeze SSYK plus phrase display result'
          git push
