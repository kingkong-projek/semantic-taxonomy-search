name: Probe occupational-information distribution

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_occupational_information.py"
      - ".github/workflows/probe-occupational-information.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover explicitly published distribution
        run: python scripts/probe_occupational_information.py | tee occupational-information-probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: occupational-information-probe
          path: occupational-information-probe.json
          if-no-files-found: error
