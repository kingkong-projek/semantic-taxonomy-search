name: A593 breadth proxy once

on:
  push:
    paths:
      - .github/workflows/a593-breadth-proxy-once.yml

permissions:
  contents: write
  actions: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download frozen A593 teacher corpus
        uses: actions/download-artifact@v4
        with:
          name: gemma-a593-checkpoint
          path: artifacts/a593
          github-token: ${{ github.token }}
          run-id: 34232985249
      - name: Compile-check
        run: >-
          python -m py_compile
          scripts/generate_gemma4_yv_teacher_pilot.py
          scripts/generate_a593_breadth_proxy.py
      - name: Generate independent task atoms and held-out query styles
        run: >-
          python scripts/generate_a593_breadth_proxy.py
          --teacher artifacts/a593/gemma-a593-teacher.jsonl
          --cases 16
          --requests-per-minute 6
          --output artifacts/a593-breadth-proxy-v0.json
      - name: Freeze proxy and self-remove
        run: |
          cp artifacts/a593-breadth-proxy-v0.json research/evaluation/v31/compile-time-semantic-a593-breadth-proxy-v0.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/a593-breadth-proxy-once.yml
          git add research/evaluation/v31/compile-time-semantic-a593-breadth-proxy-v0.json .github/workflows/a593-breadth-proxy-once.yml
          git commit -m 'research: freeze A593 cross-style breadth proxy'
          git fetch origin main
          git rebase origin/main
          git push
