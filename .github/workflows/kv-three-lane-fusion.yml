name: KV three-lane fusion ablation

on:
  push:
    branches: [main]
    paths:
      - scripts/evaluate_kv_three_lane_fusion.py
      - research/benchmark/v31/model-authored-kv-100/**
      - research/benchmark/v31/model-authored-kv-ranks101-200/**
      - research/enrichment/v31/model-teacher-kv-top100/**
      - research/enrichment/v31/model-teacher-kv-ranks101-200/**
      - .github/workflows/kv-three-lane-fusion.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evaluate fixed quota policies
        run: python scripts/evaluate_kv_three_lane_fusion.py
      - uses: actions/upload-artifact@v4
        with:
          name: kv-three-lane-fusion-v31
          path: artifacts/kv-three-lane-fusion-v31.json
          if-no-files-found: error
          retention-days: 30
