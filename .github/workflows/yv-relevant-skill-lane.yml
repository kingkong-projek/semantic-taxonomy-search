name: YV relevant-skill lane diagnostic

on:
  workflow_dispatch:
    inputs:
      taxonomy_version:
        description: Taxonomy target version
        required: true
        default: "31"
  push:
    branches: [main]
    paths:
      - "scripts/evaluate_yv_relevant_skill_lane.py"
      - "scripts/evaluate_c2_job_title_router.py"
      - "scripts/evaluate_p80_lexical_ablation.py"
      - "scripts/evaluate_pareto_c1.py"
      - "scripts/occupational_information_coverage.py"
      - "research/coverage/source-adapters.json"
      - ".github/workflows/yv-relevant-skill-lane.yml"

concurrency:
  group: yv-relevant-skill-lane
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile diagnostic
        run: python -m py_compile scripts/evaluate_yv_relevant_skill_lane.py
      - name: Install pinned decompressor
        run: python -m pip install --disable-pip-version-check zstandard==0.23.0
      - name: Measure relevant-skill lanes independently
        env:
          TAXONOMY_VERSION: ${{ github.event.inputs.taxonomy_version || '31' }}
        run: |
          python scripts/evaluate_yv_relevant_skill_lane.py \
            --version "$TAXONOMY_VERSION" \
            --output "artifacts/yv-relevant-skill-lane-diagnostic-v${TAXONOMY_VERSION}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: yv-relevant-skill-lane-diagnostic-v${{ github.event.inputs.taxonomy_version || '31' }}
          path: artifacts/yv-relevant-skill-lane-diagnostic-v${{ github.event.inputs.taxonomy_version || '31' }}.json
          if-no-files-found: error
