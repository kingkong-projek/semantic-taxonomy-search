name: Freeze Pareto demand SSOT

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/freeze-pareto-demand-ssot.yml
      - scripts/freeze_pareto_demand_ssot.py
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  freeze:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reproduce Pareto measurement
        run: python scripts/pareto_demand_coverage.py --version 31 --output-dir /tmp/pareto-demand-v31
      - name: Synchronize frozen evidence and SSOT
        run: python scripts/freeze_pareto_demand_ssot.py /tmp/pareto-demand-v31/aggregate.json
      - name: Validate synchronized state
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool research/coverage/v31/pareto-demand-aggregate.json >/dev/null
          python -m json.tool research/coverage/source-adapters.json >/dev/null
          grep -F '### 5.16 Pareto demand priority' docs/research-plan.md
          grep -F 'P80 = 159 occupation-name + 316 skill targets' docs/research-plan.md
          grep -F 'historical-taxonomy-demand-stats' research/coverage/source-adapters.json
          python - <<'PY'
          import json
          x=json.load(open('research/coverage/v31/pareto-demand-aggregate.json'))
          assert len(x['occupation_name']['ranked_p95']) == 455
          assert len(x['skill']['ranked_p95']) == 976
          assert x['occupation_name']['thresholds']['p80']['concept_count'] == 159
          assert x['skill']['thresholds']['p80']['concept_count'] == 316
          PY
      - name: Commit synchronized Pareto decision slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name kingkongola
          git config user.email adambergman90@gmail.com
          git add docs/research-plan.md docs/findings/pareto-demand-priority-v31.md research/coverage/v31/pareto-demand-aggregate.json research/coverage/source-adapters.json
          git commit -m 'research: freeze P80 semantic priority envelope'
          git push origin HEAD:main
