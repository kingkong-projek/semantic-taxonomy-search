name: A593 sniper contrast eval once

on:
  push:
    paths:
      - research/training/v31/a593-gemma4-sniper-contrasts-v0.jsonl

permissions:
  contents: write
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download frozen A593 teacher corpus
        uses: actions/download-artifact@v4
        with:
          name: gemma-a593-checkpoint
          path: artifacts/a593
          github-token: ${{ github.token }}
          run-id: 34232985249
      - name: Compile-check evaluator
        run: >-
          python -m py_compile
          scripts/evaluate_gemma_a593_sparse_paper_note.py
          scripts/evaluate_gemma_a593_hard_negative_distillation.py
          scripts/evaluate_gemma_a593_relation_aware_negatives.py
          scripts/evaluate_gemma_a593_signed_context_sparse.py
          scripts/evaluate_gemma_a593_sniper_contrasts.py
      - name: Run sniper contrast diagnostic
        run: >-
          python scripts/evaluate_gemma_a593_sniper_contrasts.py
          --teacher artifacts/a593/gemma-a593-teacher.jsonl
          --output artifacts/a593-sniper-contrast-diagnostic.json
      - name: Freeze result and self-remove
        run: |
          cp artifacts/a593-sniper-contrast-diagnostic.json research/evaluation/v31/compile-time-semantic-a593-sniper-contrasts.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/a593-sniper-contrast-eval-once.yml
          git add research/evaluation/v31/compile-time-semantic-a593-sniper-contrasts.json .github/workflows/a593-sniper-contrast-eval-once.yml
          git commit -m 'research: freeze A593 sniper contrast diagnostic'
          git push
