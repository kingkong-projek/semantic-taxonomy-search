name: Compare v31 alias source parity once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/compare-v31-alias-source-parity-once.yml

permissions:
  contents: write

jobs:
  compare:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare GraphQL and versioned all-concepts canonical aliases
        run: |
          python3 - <<'PY'
          import json, urllib.request, unicodedata
          from collections import defaultdict
          from scripts.deprecated_compatibility_coverage import as_strings, graphql

          def norm(x):
              return unicodedata.normalize('NFC', str(x or '')).casefold().strip()

          def fetch_json(url):
              with urllib.request.urlopen(url, timeout=60) as r:
                  return json.load(r)

          version='31'
          kv=fetch_json('https://data.arbetsformedlingen.se/kompetens/kompetensvaljaren/v1/kompetensvaljaren-t31.json')
          # Mirror product base skill extraction: all skill ids that occur in KV skill lists.
          cats=('regulated_skills','essential_skills','optional_skills','calculated_skills','related_skills')
          skills={}
          for node in (kv.get('data') or {}).values():
              if not isinstance(node,dict): continue
              for cat in cats:
                  val=node.get(cat)
                  if isinstance(val,dict):
                      for label,cid in val.items():
                          if isinstance(label,str) and isinstance(cid,str): skills[cid]=label
              if node.get('type') is None and not node.get('preferred_label'):
                  for label,cid in node.items():
                      if isinstance(label,str) and isinstance(cid,str): skills[cid]=label
          valid=set(skills)

          q='''query AliasParity { concepts(type: "skill", version: "31", include_deprecated: false, limit: 50000) { id preferred_label type deprecated alternative_labels hidden_labels } }'''
          _,doc,_=graphql(q)
          gql_rows=(doc.get('data') or {}).get('concepts') or []
          ac_rows=(fetch_json('https://data.jobtechdev.se/taxonomy/version/31/query/all-concepts/all-concepts.json').get('data') or {}).get('concepts') or []

          def alias_map(rows):
              out={}
              for c in rows:
                  if not isinstance(c,dict) or c.get('type')!='skill' or c.get('id') not in valid: continue
                  pref=norm(c.get('preferred_label'))
                  vals=as_strings(c.get('alternative_labels'))+as_strings(c.get('hidden_labels'))
                  ded={norm(v):v for v in vals if norm(v) and norm(v)!=pref}
                  if ded: out[c['id']]=ded
              return out

          def strict(m):
              grouped=defaultdict(set)
              exemplar={}
              for cid,aliases in m.items():
                  for n,v in aliases.items(): grouped[n].add(cid); exemplar[n]=v
              preferred=defaultdict(set)
              for cid,label in skills.items(): preferred[norm(label)].add(cid)
              result={}
              for n,targets in grouped.items():
                  if len(targets)!=1: continue
                  target=next(iter(targets))
                  p=preferred.get(n,set())
                  if target in p or p: continue
                  result[(n,target)]=exemplar[n]
              return result

          gm=alias_map(gql_rows); am=alias_map(ac_rows)
          gs=strict(gm); ass=strict(am)
          only_ac=sorted(set(ass)-set(gs))
          only_gql=sorted(set(gs)-set(ass))
          def explain(keys,m):
              return [{'normalized':n,'query':m[(n,cid)],'target_id':cid,'preferred_label':skills.get(cid)} for n,cid in keys]
          result={
            'gql_concepts':len(gql_rows),'all_concepts_concepts':len(ac_rows),'kv_skill_ids':len(valid),
            'gql_strict_unique_aliases':len(gs),'all_concepts_strict_unique_aliases':len(ass),
            'only_all_concepts':explain(only_ac,ass),'only_graphql':explain(only_gql,gs),
          }
          print(json.dumps(result,ensure_ascii=False,indent=2))
          assert len(ass)==1279
          assert len(gs)==1278
          PY
      - name: Remove one-off workflow
        run: |
          git rm .github/workflows/compare-v31-alias-source-parity-once.yml
          git config user.name semantic-taxonomy-search-bot
          git config user.email semantic-taxonomy-search-bot@users.noreply.github.com
          git commit -m 'chore: clean alias source parity workflow'
          git pull --rebase origin main
          git push origin HEAD:main
