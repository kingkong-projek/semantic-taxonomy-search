name: Gemma A149 tournament diagnostic

on:
  push:
    paths:
      - scripts/evaluate_gemma_a149.py
      - scripts/evaluate_gemma_a149_guarded.py
      - .github/workflows/gemma-a149-tournament.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download frozen Gemma hour-run corpus
        uses: actions/download-artifact@v4
        with:
          name: gemma4-yv-teacher-hour-run
          path: artifacts/gemma-teacher
          github-token: ${{ github.token }}
          run-id: 34189574629
      - name: Compile-check evaluators
        run: python -m py_compile scripts/evaluate_gemma_a149.py scripts/evaluate_gemma_a149_guarded.py
      - name: Evaluate guarded A149 against frozen opened suites
        run: >-
          python scripts/evaluate_gemma_a149_guarded.py
          --teacher artifacts/gemma-teacher/gemma4-yv-teacher-hour-run.jsonl
          --output artifacts/gemma-a149-guarded-tournament.json
      - name: Upload tournament result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemma-a149-guarded-tournament
          path: artifacts/gemma-a149-guarded-tournament.json
          if-no-files-found: warn
