name: Fold architecture breadth closeout once

on:
  push:
    paths:
      - .github/workflows/fold-architecture-breadth-closeout-once.yml
      - scripts/fold_architecture_breadth_closeout.py

permissions:
  contents: write

jobs:
  fold:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fold plan decision
        run: python scripts/fold_architecture_breadth_closeout.py
      - name: Commit and self-remove
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/fold-architecture-breadth-closeout-once.yml
          git add docs/research-plan.md .github/workflows/fold-architecture-breadth-closeout-once.yml
          git commit -m 'docs: fold architecture breadth closeout into research plan'
          git fetch origin main
          git rebase origin/main
          git push
