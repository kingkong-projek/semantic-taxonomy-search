name: Freeze blinded numeric KV source holdout once

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_training_skill_numeric_holdout.py'
      - '.github/workflows/kv-freeze-numeric-source-holdout-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build source-only benchmark without retrieval
        run: python scripts/build_training_skill_numeric_holdout.py
      - name: Commit the frozen benchmark before retrieval exists
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/benchmark/v31/training-skill-numeric-holdout/cases.jsonl research/benchmark/v31/training-skill-numeric-holdout/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'research: freeze independent numeric KV source holdout'
          git push origin HEAD:main
