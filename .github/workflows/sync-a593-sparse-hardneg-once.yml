name: Sync A593 sparse evidence once

on: [push]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply SSOT patch
        run: python scripts/apply_a593_sparse_hardneg_ssot_once.py
      - name: Commit and self-remove
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/sync-a593-sparse-hardneg-once.yml
          rm scripts/apply_a593_sparse_hardneg_ssot_once.py
          git add docs/research-plan.md .github/workflows/sync-a593-sparse-hardneg-once.yml scripts/apply_a593_sparse_hardneg_ssot_once.py
          git commit -m 'docs: record A593 sparse and hard-negative evidence'
          git push
