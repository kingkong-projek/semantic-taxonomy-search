name: P80 display calibration on natural task text

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p80-display-natural-task-calibration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile-check
        run: python -m py_compile scripts/evaluate_p80_display_natural_task_calibration.py
      - name: Calibrate on 2023 and evaluate frozen rule on 2024
        run: python scripts/evaluate_p80_display_natural_task_calibration.py
      - name: Freeze result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/evaluation/v31/p80-display-natural-task-calibration-v0.json
          git commit -m 'research: freeze natural task-text display calibration'
          git push
