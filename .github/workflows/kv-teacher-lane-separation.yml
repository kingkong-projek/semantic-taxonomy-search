name: KV teacher lane separation ablation

on:
  push:
    branches: [main]
    paths:
      - scripts/evaluate_kv_teacher_lane_separation.py
      - .github/workflows/kv-teacher-lane-separation.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare teacher evidence separation
        run: python scripts/evaluate_kv_teacher_lane_separation.py
      - uses: actions/upload-artifact@v4
        with:
          name: kv-teacher-lane-separation-v31
          path: artifacts/kv-teacher-lane-separation-v31.json
          if-no-files-found: error
          retention-days: 30
