name: Skill G1 subword complement

on:
  push:
    branches: [main]
    paths:
      - scripts/measure_skill_g1_subword_complement.py
      - .github/workflows/skill-g1-subword-complement.yml

permissions:
  contents: read

jobs:
  measure:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Measure subword complement
        run: python scripts/measure_skill_g1_subword_complement.py
      - uses: actions/upload-artifact@v4
        with:
          name: skill-g1-subword-complement-v31
          path: artifacts/skill-g1-subword-complement-v31.json
          if-no-files-found: error
          retention-days: 30
