name: Deploy semantic fallback demo

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'scripts/build_kv_demo_asset.py'
      - 'scripts/build_yv_demo_asset.py'
      - 'scripts/build_yv_demo_asset_a593.py'
      - 'scripts/check_kv_demo_runtime.mjs'
      - 'scripts/check_yv_demo_runtime.mjs'
      - 'scripts/check_yv_demo_a593_runtime.mjs'
      - 'scripts/check_demo_contract.py'
      - 'scripts/evaluate_c2_job_title_router.py'
      - 'scripts/evaluate_pareto_c1.py'
      - 'scripts/evaluate_gemma_a149.py'
      - 'scripts/evaluate_gemma_a593.py'
      - 'scripts/evaluate_kv_drop_numeric_expansion_only.py'
      - 'scripts/evaluate_kv_drop_numeric_tokens.py'
      - 'scripts/evaluate_kv_three_lane_fusion.py'
      - 'scripts/evaluate_p80_lexical_ablation.py'
      - 'scripts/evaluate_skill_c0_training_validation.py'
      - 'scripts/evaluate_skill_training_language_enrichment.py'
      - 'research/enrichment/v31/gemma4-yv-a593/**'
      - 'research/evaluation/v31/compile-time-semantic-tournament-a593.json'
      - 'research/enrichment/v31/model-teacher-kv-top100/**'
      - 'research/enrichment/v31/model-teacher-kv-ranks101-200/**'
      - 'research/enrichment/v31/model-teacher-kv-ranks201-300/**'
      - 'research/enrichment/v31/model-teacher-kv-ranks301-316/**'
      - 'research/benchmark/v31/fresh-natural-holdout/**'
      - 'research/benchmark/v31/p80-source-truth/**'
      - 'research/coverage/source-adapters.json'
      - 'research/coverage/v31/pareto-demand-aggregate.json'
      - 'research/coverage/v31/unified-target-coverage-aggregate.json'
      - 'README.md'
      - 'LICENSE'
      - 'DATA_SOURCES_AND_LICENSES.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'third_party/**'
      - '.github/workflows/pages-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: semantic-fallback-demo-pages
  cancel-in-progress: true

jobs:
  build:
    # Pages delivery must not depend on the availability of the research self-hosted runner.
    # Both deterministic engines are rebuilt and parity-checked from frozen source material.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify zero-backend responsive demo contract
        run: python scripts/check_demo_contract.py
      - name: Reproduce frozen A593 research checkpoint
        run: |
          python scripts/evaluate_gemma_a593.py \
            --teacher research/enrichment/v31/gemma4-yv-a593/phrases.jsonl \
            --output artifacts/a593-reproduction.json
          python - <<'PY'
          import json
          from pathlib import Path
          frozen = json.loads(Path('research/evaluation/v31/compile-time-semantic-tournament-a593.json').read_text())
          replay = json.loads(Path('artifacts/a593-reproduction.json').read_text())
          for key in ('candidate', 'coverage', 'size', 'strict_source_attested_17', 'opened_stress_54', 'canonical_source_truth_333'):
              if replay[key] != frozen[key]:
                  raise SystemExit(f'A593 frozen parity drift in {key}')
          print('A593 frozen checkpoint reproduced exactly')
          PY
      - name: Compile frozen A593 YV browser asset
        run: |
          # Keep the legacy filename as the stable Pages URL; engine metadata is authoritative.
          python scripts/build_yv_demo_asset_a593.py \
            --output demo/assets/yv-c2.json \
            --parity-output artifacts/yv-demo-parity-v1.json \
            --build-id "$GITHUB_SHA"
      - name: Verify A593 YV browser runtime parity
        run: node scripts/check_yv_demo_a593_runtime.mjs demo/assets/yv-c2.json artifacts/yv-demo-parity-v1.json
      - name: Compile plain KV G1+T3 browser asset
        run: |
          python scripts/build_kv_demo_asset.py \
            --output demo/assets/kv-g1-t3.json \
            --parity-output artifacts/kv-demo-parity-v1.json \
            --build-id "$GITHUB_SHA"
      - name: Verify KV browser runtime parity
        run: node scripts/check_kv_demo_runtime.mjs demo/assets/kv-g1-t3.json artifacts/kv-demo-parity-v1.json
      - name: Assemble static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R demo/. _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/assets/yv-c2.json
          test -s _site/assets/kv-g1-t3.json
          echo "Site bytes: $(du -sb _site | cut -f1)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
