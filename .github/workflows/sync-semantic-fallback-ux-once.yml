name: Sync semantic fallback UX once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-semantic-fallback-ux-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update SSOT hypothesis and UX ladder
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/research-plan.md')
          s = p.read_text()
          old = """Keep fast lexical selection as the privileged path where a consuming service already has it. Add semantic description search when ordinary lookup is insufficient. YV/KV remain useful reference UX examples:\n\n```text\nYV: Hittar du inte det du söker? [Beskriv yrket]\nKV: Hittar du inte kompetensen? [Beskriv kompetensen / vad du kan göra]\n```\n\nDescription mode explicitly includes ordinary first-person/task language such as `jag drog kabel, kopplade uttag och läste elscheman`, not only near-synonyms of taxonomy labels. Tasks, tools, methods, responsibilities and colloquial wording are first-class fallback input.\n"""
          new = """Keep fast lexical selection as the privileged path where a consuming service already has it. A live hypothesis is that **YV and KV may already be very good within their current selector architecture**; the vague report that some users cannot find an occupation/competence is not evidence that ordinary search is broadly broken. Track 1 therefore measures and fixes only demonstrated current-selector failures instead of assuming a semantic diagnosis.\n\nEven a near-perfect YV/KV selector still leaves a separate product need: some users do not know the occupational or competence term they need to search for. Semantic free-text is intended for that case, not as a replacement for a healthy lexical selector. The preferred UX is a progressive fallback ladder:\n\n```text\n1. ordinary YV/KV lookup\n2. if the user does not get a useful match: [Sök med fritext]\n3. interpret description/task/tool/method language and return canonical candidates\n4. if confidence is still insufficient: [Ge förslag] / clarification rather than forcing a nearest neighbour\n```\n\nThe exact labels are product copy hypotheses, not a frozen UI contract. The important contract is progressive disclosure: do not make users describe something semantically when they already know its name, but provide semantic help when naming/terminology is the actual obstacle. `Tillåt fritext` should therefore not be treated as a mere manual-string escape hatch; the semantic path should be framed as an active **search with free text**, with safe suggestions/clarification if a direct confident match is unavailable.\n\nDescription mode explicitly includes ordinary first-person/task language such as `jag drog kabel, kopplade uttag och läste elscheman`, not only near-synonyms of taxonomy labels. Tasks, tools, methods, responsibilities and colloquial wording are first-class fallback input.\n"""
          if old not in s:
              raise SystemExit('expected UX block not found; refusing stale edit')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify two-track boundary remains intact
        run: |
          grep -F "YV and KV may already be very good" docs/research-plan.md
          grep -F "[Sök med fritext]" docs/research-plan.md
          grep -F "Track 2 — free-text description fallback (PAUSED)" docs/research-plan.md
      - name: Commit SSOT and remove one-off workflow
        run: |
          rm .github/workflows/sync-semantic-fallback-ux-once.yml
          git config user.name semantic-taxonomy-search-bot
          git config user.email semantic-taxonomy-search-bot@users.noreply.github.com
          git add docs/research-plan.md .github/workflows/sync-semantic-fallback-ux-once.yml
          git diff --cached --check
          git commit -m 'research: clarify progressive semantic fallback hypothesis'
          git push origin HEAD:main
